<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<script src="i18n.js" charset="utf-8"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administração · Gescolar</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="gescolar.css">
<style>
/* Gescolar · painel de administração da plataforma — v5.24 */
body{background:var(--bg);margin:0}
.pf-top{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:30}
.pf-top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px}
.pf-top img{width:38px;height:38px;border-radius:50%;background:#fff}
.pf-top b{font:800 18px var(--f-display)}
.pf-top small{display:block;color:rgba(255,255,255,.7);font-size:12.5px}
.pf-top .sp{flex:1}
.pf-top a,.pf-top button{color:#fff;border:1px solid rgba(255,255,255,.25);background:none;border-radius:9px;height:34px;padding:0 12px;font:600 13px var(--f-body);display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.pf-tabs{max-width:1240px;margin:0 auto;display:flex;gap:4px;padding:0 16px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:66px;z-index:20}
.pf-tabs button{border:0;background:none;padding:14px 14px 12px;font:700 14.5px var(--f-body);color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.pf-tabs button.on{color:var(--ink);border-bottom-color:var(--blue)}
.pf-tabs .n{background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;line-height:1.5}
.pf-main{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
.pf-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi .v.bad{color:var(--bad)} .kpi .v.ok{color:var(--ok)}
.carregar{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 16px;color:var(--muted)}
.carregar .spinner{margin:0;width:28px;height:28px;border-width:3px}
.msg-err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
.mov{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.mov:last-child{border-bottom:0}
.mov .tx{flex:1;min-width:0}
.mov .tx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .vl{font:700 14px var(--f-mono);white-space:nowrap}
.filtro{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;height:32px;padding:0 13px;font:600 13px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips button b{font-family:var(--f-mono);font-size:12px;opacity:.75}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.45;flex:none}
.dot.on{background:var(--ok);opacity:1;box-shadow:0 0 0 4px var(--ok-soft);animation:pfP 1.6s infinite}
@keyframes pfP{50%{box-shadow:0 0 0 7px transparent}}
.acesso{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.lista-al .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.lista-al .it:last-child{border-bottom:0}
.lista-al .it .tx{flex:1;min-width:0}
.lista-al .it small{display:block;color:var(--muted);font-size:12.5px}
.vazio{color:var(--muted);font-size:14px;padding:12px 0}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);margin-left:6px;vertical-align:middle}
.preview{background:var(--ok-soft);color:var(--ok);border-radius:9px;padding:10px 12px;font-size:14px;font-weight:700}
.row-acts{white-space:nowrap;text-align:right}
@media (max-width:640px){.pf-tabs{top:66px}.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"><div class="carregar"><div class="spinner"></div>A abrir…</div></div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
'use strict';
var PROXY='https://gescolar-proxy.onrender.com';
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function grp(n){ return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function dinheiro(n){ var v=Math.abs(Number(Number(n||0).toFixed(6))), s=v.toFixed(6).replace(/0+$/,'').replace(/\.$/,''), p=s.split('.'), d=p[1]||''; if(d.length===1) d+='0'; return (Number(n)<0&&v?'-':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(d?','+d:''); }
function mt(n){ return dinheiro(n)+' MT'; }
function data(iso){ if(!iso) return '—'; var d=new Date(iso); return isNaN(d)?'—':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function desde(iso){ if(!iso) return 'nunca'; var t=new Date(iso).getTime(); if(isNaN(t)) return '—'; var m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'agora'; if(m<60) return 'há '+m+' min'; var h=Math.round(m/60); if(h<24) return 'há '+h+' h'; var d=Math.round(h/24); if(d<31) return 'há '+d+(d===1?' dia':' dias'); return data(iso); }
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.innerHTML='<i></i><span>'+esc(m)+'</span>'; $('#toasts').appendChild(t); setTimeout(function(){ t.remove(); },3600); }
function erroCaixa(m){ return '<div class="msg-err">'+esc(m)+'</div>'; }
function modal(html, largo){ fechar(); var s=document.createElement('div'); s.className='scrim'; s.id='ov'; s.innerHTML='<div class="modal" role="dialog" aria-modal="true"'+(largo?' style="max-width:860px"':'')+'>'+html+'</div>'; s.addEventListener('mousedown',function(e){ if(e.target===s) fechar(); }); document.body.appendChild(s); $$('[data-fechar]',s).forEach(function(b){ b.onclick=fechar; }); }
function fechar(){ var o=$('#ov'); if(o) o.remove(); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') fechar(); });
var SIT={teste:['Teste','info'],activa:['Activa','ok'],tolerancia:['Tolerância','warn'],expirada:['Expirada','bad'],suspensa:['Suspensa','bad'],desconhecida:['—','muted']};
var MET={mpesa:'M-Pesa',emola:'e-Mola',cartao:'Cartão',balcao:'Numerário',numerario:'Numerário',transferencia:'Transferência bancária',oferta:'Oferta / cortesia'};
var EST_SUB={pago:['Paga','ok'],pendente:['Pendente','warn'],revisao:['Em revisão','warn'],falhado:['Falhada','bad'],expirado:['Expirada','bad'],anulada:['Anulada','muted']};
var PAPEL={Direccao:'Direcção',Secretaria:'Secretaria',Professor:'Professores',Estudante:'Estudantes',Encarregado:'Encarregados',Plataforma:'Plataforma'};

var SES=null; try{ SES=JSON.parse(localStorage.getItem('gs_sessao')||'null'); }catch(e){}
if(!SES || !SES.token){ location.replace('entrar.html'); return; }
function sair(){ try{ localStorage.removeItem('gs_sessao'); }catch(e){} location.replace('entrar.html'); }
function api(rota,corpo){
  return fetch(PROXY+rota,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SES.token},body:JSON.stringify(corpo||{})})
    .then(function(r){ return r.json().catch(function(){ return {ok:false,erro:'Resposta inválida do servidor.'}; }).then(function(d){ if(r.status===401) sair(); return d; }); })
    .catch(function(){ return {ok:false,erro:'Sem ligação ao servidor.'}; });
}
var aba0='geral'; try{ aba0=localStorage.getItem('gs_pl_aba')||'geral'; }catch(e){}
var S={ d:null, saques:[], subs:null, aba:aba0, filtro:'', ordem:'nome', sit:'todas', sfiltro:'', sest:'todas', cfiltro:'', sessao:null };

// ---------- casca ----------
function casca(){
  $('#root').innerHTML='<header class="pf-top"><div class="in"><img src="logo.png" alt=""><div><b>Administração Gescolar</b><small>'+esc(S.sessao.nome||'')+'</small></div><span class="sp"></span>'+
    (S.sessao.escola?'<a href="direccao.html">A minha escola</a>':'')+GSI18n.seletor()+'<button id="sair">Sair</button></div></header>'+
    '<nav class="pf-tabs" id="tabs"></nav><main class="pf-main" id="pg"><div class="carregar"><div class="spinner"></div>A calcular…</div></main>';
  $('#sair').onclick=sair;
  carregar();
  setInterval(online, 30000);
}
function tabs(){
  var t=S.d?S.d.totais:{}, A=[['geral','Visão geral',0],['escolas','Escolas',0],['assinaturas','Assinaturas',t.revisao||0],['carteira','Carteira',S.saques.length]];
  $('#tabs').innerHTML=A.map(function(a){ return '<button data-aba="'+a[0]+'" class="'+(S.aba===a[0]?'on':'')+'">'+a[1]+(a[2]?'<span class="n">'+a[2]+'</span>':'')+'</button>'; }).join('');
  $$('[data-aba]').forEach(function(b){ b.onclick=function(){ S.aba=b.getAttribute('data-aba'); try{ localStorage.setItem('gs_pl_aba',S.aba); }catch(e){} desenhar(); window.scrollTo(0,0); }; });
}
function carregar(){
  Promise.all([api('/pl/resumo'), api('/pl/saques')]).then(function(r){ var d=r[0];
    if(!d.ok){ $('#pg').innerHTML=erroCaixa(d.erro); return; }
    S.d=d; S.saques=r[1].ok?r[1].saques:[]; S.subs=null; desenhar();
  });
}
// actualiza só quem está online (pedido leve, de 30 em 30 segundos)
function online(){
  if(!S.d || document.hidden) return;
  api('/pl/online').then(function(r){
    if(!r.ok) return;
    var tot=0, ne=0;
    S.d.escolas.forEach(function(e){ var p=r.escolas[e.id]; if(p){ var ult=e.presenca&&e.presenca.ultimo; e.presenca=p; if(ult && (!p.ultimo || ult>p.ultimo)) e.presenca.ultimo=ult; } else if(e.presenca){ e.presenca.online=0; e.presenca.papeis={}; } if(e.presenca&&e.presenca.online){ tot+=e.presenca.online; ne++; } });
    S.d.totais.online_pessoas=tot; S.d.totais.online_escolas=ne;
    if(!$('#ov') && (S.aba==='geral'||S.aba==='escolas')){ var f=$('#f'), foco=f&&document.activeElement===f, pos=f?f.selectionStart:0; desenhar(); if(foco){ f=$('#f'); f.focus(); f.setSelectionRange(pos,pos); } }
  });
}
function desenhar(){
  tabs();
  if(S.aba==='escolas') return escolas();
  if(S.aba==='assinaturas') return assinaturas();
  if(S.aba==='carteira') return carteira();
  geral();
}
function kpi(l,v,d,cls){ return '<div class="card kpi"><div class="l">'+l+'</div><div class="v num '+(cls||'')+'" style="font-size:24px">'+v+'</div><div class="d">'+esc(d)+'</div></div>'; }
function acessoHtml(e){ var p=e.presenca||{};
  if(p.online) return '<span class="acesso"><i class="dot on"></i><b style="color:var(--ok)">'+p.online+' online</b></span>';
  return '<span class="acesso muted"><i class="dot"></i>'+esc(desde(p.ultimo))+'</span>'; }
function situ(e){ var s=SIT[e.situacao.estado]||SIT.desconhecida; return '<span class="pill '+s[1]+'">'+s[0]+'</span><div class="small muted">'+(e.situacao.ate?'até '+data(e.situacao.ate)+(e.situacao.dias!=null&&e.situacao.dias>=0&&e.situacao.dias<=7?' · '+e.situacao.dias+' d':''):'')+'</div>'; }
function porId(id){ return (S.d.escolas||[]).filter(function(e){ return e.id===id; })[0]; }

// ---------- visão geral ----------
function geral(){
  var d=S.d, t=d.totais, E=d.escolas;
  var on=E.filter(function(e){ return e.presenca&&e.presenca.online; }).sort(function(a,b){ return b.presenca.online-a.presenca.online; });
  var exp=E.filter(function(e){ return ['activa','teste'].indexOf(e.situacao.estado)>=0 && e.situacao.dias!=null && e.situacao.dias<=7; }).sort(function(a,b){ return a.situacao.dias-b.situacao.dias; });
  var venc=E.filter(function(e){ return ['expirada','tolerancia'].indexOf(e.situacao.estado)>=0; });
  var novas=E.slice().sort(function(a,b){ return String(b.criada||'').localeCompare(String(a.criada||'')); }).slice(0,6);
  function linha(e,dir){ return '<div class="it"><div class="tx"><b>'+esc(e.nome)+'</b><small>'+dir+'</small></div><button class="btn sm pri" data-atr="'+esc(e.id)+'">Atribuir</button> <button class="btn sm" data-ver="'+esc(e.id)+'">Gerir</button></div>'; }
  $('#pg').innerHTML=
    '<div class="pf-kpis">'+
      kpi('Escolas',grp(t.escolas),t.activas+' activas · '+t.teste+' em teste')+
      kpi('Online agora',grp(t.online_pessoas||0),(t.online_escolas||0)+' escola'+((t.online_escolas||0)===1?'':'s')+' · últimos '+(t.online_min||5)+' min',(t.online_pessoas?'ok':''))+
      kpi('Estudantes',grp(t.estudantes),'em todas as escolas')+
      kpi('Receita mensal prevista',mt(t.mensal||0),'escolas activas × preço do plano')+
      kpi('Assinaturas este mês',mt(t.assinaturas_mes),mt(t.assinaturas)+' desde o início')+
      kpi('A expirar / expiradas',(t.a_expirar||0)+' / '+(t.expiradas||0),(t.suspensas||0)+' suspensa'+((t.suspensas||0)===1?'':'s'),(t.expiradas?'bad':''))+
    '</div>'+
    ((t.revisao||S.saques.length)?'<section class="card" style="margin-bottom:14px;border-left:4px solid var(--warn)"><div class="card-b" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="flex:1">Precisa de atenção</b>'+
      (t.revisao?'<button class="btn sm" data-ir="assinaturas">'+t.revisao+' assinatura'+(t.revisao===1?'':'s')+' em revisão</button>':'')+
      (S.saques.length?'<button class="btn sm" data-ir="carteira">'+S.saques.length+' saque'+(S.saques.length===1?'':'s')+' por resolver</button>':'')+'</div></section>':'')+
    '<div class="grid2">'+
      '<section class="card"><div class="card-b"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><i class="dot '+(on.length?'on':'')+'"></i><b style="font-size:16px">Online agora</b></div><div class="lista-al">'+
        (on.length?on.map(function(e){ var p=e.presenca.papeis||{}; return '<div class="it"><div class="tx"><b>'+esc(e.nome)+'</b><small>'+Object.keys(p).map(function(k){ return p[k]+' '+(PAPEL[k]||k); }).join(' · ')+'</small></div><b class="num" style="color:var(--ok)">'+e.presenca.online+'</b></div>'; }).join(''):'<div class="vazio">Ninguém a usar o Gescolar nos últimos '+(t.online_min||5)+' minutos.</div>')+
      '</div></div></section>'+
      '<section class="card"><div class="card-b"><b style="font-size:16px">A expirar nos próximos 7 dias</b><div class="lista-al">'+
        (exp.length?exp.map(function(e){ return linha(e,(SIT[e.situacao.estado]||SIT.desconhecida)[0]+' · '+(e.situacao.dias===0?'termina hoje':'faltam '+e.situacao.dias+' dias')+' · '+esc(e.plano)); }).join(''):'<div class="vazio">Nenhuma escola a expirar esta semana.</div>')+
      '</div></div></section>'+
      '<section class="card"><div class="card-b"><b style="font-size:16px">Expiradas ou em tolerância</b><div class="lista-al">'+
        (venc.length?venc.map(function(e){ return linha(e,(SIT[e.situacao.estado]||SIT.desconhecida)[0]+' · terminou '+data(e.situacao.ate)+' · '+esc(e.plano)); }).join(''):'<div class="vazio">Nenhuma escola com a assinatura vencida.</div>')+
      '</div></div></section>'+
      '<section class="card"><div class="card-b"><b style="font-size:16px">Escolas mais recentes</b><div class="lista-al">'+
        (novas.length?novas.map(function(e){ return '<div class="it"><div class="tx"><b>'+esc(e.nome)+'</b><small>criada '+data(e.criada)+' · '+esc([e.cidade,e.provincia].filter(Boolean).join(', ')||e.subdominio)+'</small></div>'+situ(e).split('<div')[0]+' <button class="btn sm" data-ver="'+esc(e.id)+'">Gerir</button></div>'; }).join(''):'<div class="vazio">Ainda sem escolas.</div>')+
      '</div></div></section>'+
    '</div>';
  ligar();
}
function ligar(){
  $$('[data-ver]').forEach(function(b){ b.onclick=function(){ verEscola(porId(b.getAttribute('data-ver'))); }; });
  $$('[data-atr]').forEach(function(b){ b.onclick=function(){ atribuir(porId(b.getAttribute('data-atr'))); }; });
  $$('[data-tr]').forEach(function(b){ b.onclick=function(){ transferir(porId(b.getAttribute('data-tr'))); }; });
  $$('[data-ir]').forEach(function(b){ b.onclick=function(){ S.aba=b.getAttribute('data-ir'); desenhar(); }; });
}

// ---------- escolas ----------
function filtroSit(e,k){
  if(k==='online') return !!(e.presenca&&e.presenca.online);
  if(k==='expirar') return ['activa','teste'].indexOf(e.situacao.estado)>=0 && e.situacao.dias!=null && e.situacao.dias<=7;
  if(k==='expiradas') return ['expirada','tolerancia'].indexOf(e.situacao.estado)>=0;
  if(k==='todas') return true;
  return e.situacao.estado===k;
}
function escolas(){
  var E=S.d.escolas, C=[['todas','Todas'],['online','Online agora'],['activa','Activas'],['teste','Em teste'],['expirar','A expirar'],['expiradas','Expiradas'],['suspensa','Suspensas']];
  var L=E.filter(function(e){ var f=S.filtro.toLowerCase(); return filtroSit(e,S.sit) && (!f || (e.nome+' '+e.subdominio+' '+e.cidade+' '+e.provincia+' '+e.email+' '+e.telefone).toLowerCase().indexOf(f)>=0); });
  L.sort(function(a,b){ return S.ordem==='validade'?String(a.situacao.ate||'9').localeCompare(String(b.situacao.ate||'9')):S.ordem==='estudantes'?b.estudantes-a.estudantes:S.ordem==='acesso'?((b.presenca.online-a.presenca.online)||String(b.presenca.ultimo||'').localeCompare(String(a.presenca.ultimo||''))):S.ordem==='recentes'?String(b.criada||'').localeCompare(String(a.criada||'')):a.nome.localeCompare(b.nome,'pt'); });
  $('#pg').innerHTML=
    '<div class="chips">'+C.map(function(c){ return '<button data-sit="'+c[0]+'" class="'+(S.sit===c[0]?'on':'')+'">'+c[1]+' <b>'+E.filter(function(e){ return filtroSit(e,c[0]); }).length+'</b></button>'; }).join('')+'</div>'+
    '<div class="filtro"><input class="inp" id="f" placeholder="Procurar escola, cidade, email, telefone…" value="'+esc(S.filtro)+'" style="flex:1;min-width:220px">'+
      '<select class="sel" id="o">'+[['nome','Nome'],['acesso','Online / último acesso'],['validade','Validade mais próxima'],['estudantes','Mais estudantes'],['recentes','Mais recentes']].map(function(o){ return '<option value="'+o[0]+'"'+(S.ordem===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>'+
      '<button class="btn" id="r">Actualizar</button></div>'+
    '<section class="card"><div class="tbl-wrap"><table><thead><tr><th>Escola</th><th>Plano</th><th>Assinatura</th><th>Acesso</th><th class="r">Estud.</th><th></th></tr></thead><tbody>'+
      (L.length? L.map(function(e){
        return '<tr><td><b>'+esc(e.nome)+'</b>'+(e.subs_pendentes?'<span class="tag" style="color:var(--warn)">'+e.subs_pendentes+' pend.</span>':'')+'<div class="small muted">'+esc([e.subdominio,e.cidade,e.provincia].filter(Boolean).join(' · '))+'</div></td><td>'+esc(e.plano)+'</td><td>'+situ(e)+'</td><td>'+acessoHtml(e)+'</td><td class="r num">'+grp(e.estudantes)+'</td>'+
          '<td class="row-acts"><button class="btn sm pri" data-atr="'+esc(e.id)+'">Atribuir</button> <button class="btn sm" data-ver="'+esc(e.id)+'">Gerir</button></td></tr>'; }).join('')
        : '<tr><td colspan="6" class="muted" style="text-align:center;padding:30px">Nenhuma escola encontrada.</td></tr>')+
    '</tbody></table></div></section>';
  $('#f').oninput=function(){ S.filtro=this.value; var p=this.selectionStart; escolas(); var f=$('#f'); f.focus(); f.setSelectionRange(p,p); };
  $('#o').onchange=function(){ S.ordem=this.value; escolas(); };

function verEscola(e){
  if(!e) return;
  modal('<div class="modal-h"><h3>'+esc(e.nome)+'</h3><button class="icon-btn" data-fechar>✕</button></div><div class="modal-b" id="ve"><div class="carregar"><div class="spinner"></div>A abrir…</div></div>', true);
  api('/pl/escola',{id:e.id}).then(function(d){
    var el=$('#ve'); if(!el) return;
    if(!d.ok){ el.innerHTML=erroCaixa(d.erro); return; }
    var x=d.escola, s=SIT[x.situacao.estado]||SIT.desconhecida, pr=e.presenca||{};
    el.innerHTML=
      '<div class="small muted">'+esc(['Código '+e.subdominio, 'NUIT '+(e.nuit||'—'), e.telefone, e.email, [e.cidade,e.provincia].filter(Boolean).join(', '), 'criada '+data(e.criada)].filter(Boolean).join(' · '))+'</div>'+
      '<div class="acesso">'+acessoHtml(e)+(pr.online?'<span class="small muted">'+Object.keys(pr.papeis||{}).map(function(k){ return pr.papeis[k]+' '+(PAPEL[k]||k); }).join(' · ')+'</span>':'<span class="small muted">último acesso</span>')+' · <span class="small muted">'+grp(e.estudantes)+' estudantes activos</span></div>'+
      '<div class="card card-b" style="background:var(--bg)"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><div class="eyebrow">Assinatura</div><button class="btn sm pri" id="e-atr">+ Atribuir assinatura</button></div>'+
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><span class="pill '+s[1]+'">'+s[0]+'</span><span class="small">'+(x.situacao.ate?'até '+data(x.situacao.ate)+(x.situacao.dias!=null?' ('+(x.situacao.dias>=0?'faltam '+x.situacao.dias:'há '+(-x.situacao.dias))+' dias)':''):'sem data')+'</span>'+(x.teste_ate?'<span class="small muted">· teste até '+data(x.teste_ate)+'</span>':'')+'</div>'+
        '<div class="frow"><label class="field">Plano<select class="sel" id="e-p">'+['Essencial','Pro','Rede'].map(function(p){ return '<option'+(p===x.plano?' selected':'')+'>'+p+'</option>'; }).join('')+'</select></label>'+
        '<label class="field">Estado<select class="sel" id="e-s">'+[['teste','Teste'],['activa','Activa'],['suspensa','Suspensa (bloqueia o acesso)']].map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===x.estado?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></label></div>'+
        '<div class="frow"><label class="field">Válida até<input class="inp" type="date" id="e-v" value="'+(x.valida_ate?String(x.valida_ate).slice(0,10):'')+'"></label><label class="field">Prolongar o teste<select class="sel" id="e-t"><option value="">—</option><option value="7">+7 dias de teste</option><option value="14">+14 dias de teste</option><option value="30">+30 dias de teste</option></select></label></div>'+
        '<label class="small" style="display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:600;margin-top:8px"><input type="checkbox" id="e-sms"'+(e.telefone?'':' disabled')+'> Avisar a escola por SMS se suspender ou reactivar</label>'+
        '<div id="e-e"></div><button class="btn" id="e-ok" style="margin-top:10px">Guardar alterações</button></div>'+
      '<div class="eyebrow">Pagamentos da assinatura</div><div>'+(d.assinaturas.length? d.assinaturas.map(function(a,i){ var st=EST_SUB[a.estado]||[a.estado,'muted']; return '<div class="mov"><div class="tx"><b>'+esc(a.plano)+' · '+a.meses+(a.meses===1?' mês':' meses')+'</b><small>'+data(a.data)+' · '+esc(MET[a.metodo]||a.metodo)+(a.valida_ate?' · até '+data(a.valida_ate):'')+'</small></div><span class="pill '+st[1]+'">'+st[0]+'</span><div class="vl">'+mt(a.valor)+'</div>'+
          (['pendente','revisao'].indexOf(a.estado)>=0?'<button class="btn sm pri" data-eapr="'+i+'">Aprovar</button>':'')+(a.estado!=='anulada'?'<button class="btn sm danger" data-eanu="'+i+'" title="Anular">✕</button>':'')+'</div>'; }).join('') : '<p class="small muted">Ainda sem pagamentos.</p>')+'</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="eyebrow">Extracto da carteira · saldo '+mt(e.saldo)+'</div><button class="btn sm" id="e-tr">Registar transferência</button></div>'+
      '<div>'+(d.movimentos.length? d.movimentos.map(function(m){ return '<div class="mov"><div class="tx"><b>'+(m.tipo==='entrada'?'Propina · '+esc(MET[m.metodo]||m.metodo):'Transferência para a escola')+'</b><small>'+data(m.data)+' · '+esc(m.texto||'')+(m.feita_por?' · '+esc(m.feita_por):'')+'</small></div><div class="vl" style="color:'+(m.tipo==='entrada'?'var(--ok)':'var(--bad)')+'">'+(m.tipo==='entrada'?'+':'−')+mt(m.valor)+'</div>'+(m.tipo==='transferencia'?'<button class="btn sm danger" data-del="'+esc(m.id)+'" title="Apagar registo">✕</button>':'')+'</div>'; }).join('') : '<p class="small muted">Sem movimentos.</p>')+'</div>';
    $('#e-ok').onclick=function(){
      var b=this; b.disabled=true;
      var corpo={id:x.id, plano:$('#e-p').value, estado:$('#e-s').value, sms:$('#e-sms').checked}; var v=$('#e-v').value, t=$('#e-t').value;
      if(v && v!==(x.valida_ate?String(x.valida_ate).slice(0,10):'')) corpo.valida_ate=v;
      if(t) corpo.mais_dias_teste=+t;
      if(corpo.estado==='suspensa' && x.estado!=='suspensa' && !confirm('Suspender '+e.nome+'? Ninguém da escola consegue entrar até reactivar.')){ b.disabled=false; return; }
      api('/pl/escola-guardar',corpo).then(function(r){ b.disabled=false; if(!r.ok){ $('#e-e').innerHTML=erroCaixa(r.erro); return; } toast('Escola actualizada'); fechar(); recarregarTudo(); });
    };
    $('#e-atr').onclick=function(){ atribuir(e); };
    $('#e-tr').onclick=function(){ transferir(e, function(){ carregar(); }); };
    $$('[data-eapr]').forEach(function(b){ b.onclick=function(){ var a=d.assinaturas[+b.getAttribute('data-eapr')]; a.escola_nome=e.nome; aprovar(a); }; });
    $$('[data-eanu]').forEach(function(b){ b.onclick=function(){ anular(d.assinaturas[+b.getAttribute('data-eanu')]); }; });
    $$('[data-del]').forEach(function(b){ b.onclick=function(){ if(!confirm('Apagar este registo de transferência? O saldo volta a subir.')) return; b.disabled=true; api('/pl/transferencia-apagar',{id:b.getAttribute('data-del')}).then(function(r){ if(!r.ok){ toast(r.erro); b.disabled=false; return; } toast('Registo apagado'); fechar(); carregar(); }); }; });
  });
}

fetch(PROXY+'/sessao',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SES.token}})
  .then(function(r){ return r.json().then(function(d){ return {st:r.status,d:d}; }); })
  .then(function(x){
    var d=x.d;
    if(x.st===401) return sair();
    if(!d.ok){ $('#root').innerHTML='<div class="carregar">'+esc(d.erro||'Não foi possível abrir.')+'</div>'; return; }
    if(!d.plataforma){ location.replace((d.pagina||'entrar')+'.html'); return; }
    SES.token=d.token; try{ localStorage.setItem('gs_sessao',JSON.stringify({token:d.token,nome:d.nome,papel:d.papel,pagina:d.pagina,escola:d.escola,criada:Date.now()})); }catch(e){}
    S.sessao=d; casca();
  })
  .catch(function(){ $('#root').innerHTML='<div class="carregar">Sem ligação ao servidor do Gescolar. <a class="link" href="">Tentar de novo</a></div>'; });
})();
</script>
</body>
</html>
