<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A4A">
<title>Gescolar · Professor</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="gescolar.css">
<style>
body{background:var(--bg);margin:0}
.pt{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pt-top{background:var(--navy);color:#fff;padding:14px 16px 0}
.pt-top .in{max-width:1180px;margin:0 auto}
.pt-row{display:flex;align-items:center;gap:12px}
.pt-logo{width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.pt-logo img{max-width:38px;max-height:38px;object-fit:contain}
.pt-logo.ini{background:rgba(255,255,255,.14);color:#fff;font:800 15px var(--f-display)}
.pt-esc{min-width:0;flex:1}
.pt-esc b{display:block;font:800 16px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-esc small{color:rgba(255,255,255,.7);font-size:13px}
.pt-sair{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:9px;height:34px;padding:0 12px;font:600 13px var(--f-body);display:flex;align-items:center;gap:6px;cursor:pointer}
.pt-sair svg{width:14px;height:14px}
.pt-kids{display:flex;gap:8px;overflow-x:auto;padding:14px 0 0;scrollbar-width:none}
.pt-kids::-webkit-scrollbar{display:none}
.pt-kid{flex:none;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;border-radius:99px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;font:600 14px var(--f-body);cursor:pointer}
.pt-kid .av{width:26px;height:26px;font-size:11px}
.pt-kid.on{background:#fff;color:var(--navy);border-color:#fff}
.pt-tabs{display:flex;gap:4px;margin-top:12px}
.pt-tabs button{background:none;border:0;color:rgba(255,255,255,.72);font:600 14px var(--f-body);padding:12px 12px 13px;border-bottom:3px solid transparent;cursor:pointer;display:flex;align-items:center;gap:7px}
.pt-tabs button svg{width:16px;height:16px}
.pt-tabs button.on{color:#fff;border-bottom-color:var(--sun)}
.pt-main.largo{max-width:1180px}
.pt-main{max-width:860px;margin:0 auto;padding:18px 16px}
.pt-nav{display:none}
@media print{.pt-top,.pt-nav{display:none!important}.pt{padding:0}.pt-main{padding:0;max-width:none}.card{box-shadow:none;border:0}}
@media (max-width:720px){
  .pt-tabs{display:none}
  .pt-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .pt-nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11.5px var(--f-body);color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
  .pt-nav button svg{width:22px;height:22px}
  .pt-nav button.on{color:var(--blue)}
  .pt-nav .bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
}
.pt-hero{border-radius:16px;padding:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;margin-bottom:14px}
.pt-hero .av{width:52px;height:52px;font-size:18px;flex:none}
.pt-hero b{display:block;font:800 19px/1.2 var(--f-display)}
.pt-hero .info{color:var(--muted);font-size:14px}
.saldo{border-radius:16px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--navy),#0A64DC);margin-bottom:14px;position:relative;overflow:hidden}
.saldo.ok{background:linear-gradient(135deg,#0F6B41,#168A52)}
.saldo.bad{background:linear-gradient(135deg,#7A1F1F,#C0392B)}
.saldo .l{font-size:13.5px;opacity:.85;font-weight:600}
.saldo .v{font:800 32px/1.15 var(--f-display);margin:4px 0 2px;letter-spacing:-.02em}
.saldo .d{font-size:14px;opacity:.9}
.saldo .btn{margin-top:14px;background:#fff;color:var(--navy);border-color:#fff;height:44px;font-size:15px}
.pt-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mini .l{font-size:12.5px;color:var(--muted);font-weight:600}
.mini .v{font:800 19px var(--f-display);margin-top:4px}
.mini .d{font-size:13px;color:var(--muted);margin-top:2px}
.sec-t{font:800 16px var(--f-display);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec-t a,.sec-t button{font:600 14px var(--f-body);color:var(--blue);background:none;border:0;cursor:pointer;text-decoration:none}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pt-it{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pt-it:last-child{border-bottom:0}
.pt-it .cx{width:22px;height:22px;flex:none;accent-color:var(--blue)}
.pt-it .tx{flex:1;min-width:0}
.pt-it .tx b{display:block;font-size:15px}
.pt-it .tx small{color:var(--muted);font-size:13px}
.pt-it .vl{text-align:right;flex:none}
.pt-it .vl b{display:block;font-family:var(--f-mono);font-size:14.5px}
.pt-it .vl small{color:var(--muted);font-size:12px}
.pt-it.marcado{background:var(--blue-soft)}
label.pt-it{cursor:pointer}
.vazio{text-align:center;padding:36px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.vazio .ic{width:54px;height:54px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin:0 auto 12px}
.vazio .ic svg{width:26px;height:26px}
.vazio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.barra-pagar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:14px;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px -10px rgba(6,14,28,.5)}
@media (min-width:721px){.barra-pagar{bottom:16px}}
.barra-pagar .tx{flex:1}
.barra-pagar small{display:block;opacity:.8;font-size:12.5px}
.barra-pagar b{font:800 19px var(--f-display)}
.barra-pagar .btn{background:var(--sun);border-color:var(--sun);color:#2c2000;height:44px;font-size:15px}
.dias{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font:700 14px var(--f-body);color:var(--muted);cursor:pointer}
.dias button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dias button.hoje:not(.on){border-color:var(--blue);color:var(--blue)}
.aula{display:flex;gap:12px;align-items:stretch;padding:12px 14px;border-bottom:1px solid var(--line)}
.aula:last-child{border-bottom:0}
.aula .hr{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);width:52px;flex:none;line-height:1.35}
.aula .barra{width:4px;border-radius:4px;flex:none}
.aula .tx{flex:1;min-width:0}
.aula .tx b{display:block;font-size:15px}
.aula .tx small{color:var(--muted);font-size:13px}
.aula.livre .tx b{color:var(--muted);font-weight:500}
.aula.agora{background:var(--blue-soft)}
.com-it{padding:14px 16px;border-bottom:1px solid var(--line)}
.com-it:last-child{border-bottom:0}
.com-it b{display:block;font-size:15.5px}
.com-it small{color:var(--muted);font-size:12.5px}
.com-it p{margin:6px 0 0;white-space:pre-wrap;font-size:14.5px;line-height:1.5;color:var(--ink)}
.com-it p.corta{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.com-it button{background:none;border:0;padding:0;margin-top:4px;color:var(--blue);font:600 13.5px var(--f-body);cursor:pointer}
.carregar{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 16px;color:var(--muted)}
.carregar .spinner{margin:0;width:28px;height:28px;border-width:3px}
.msg-err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
.method{cursor:pointer}
.modal .btn.pri{justify-content:center}
.dc{padding:14px 16px;border-bottom:1px solid var(--line)}
.dc:last-child{border-bottom:0}
.dc-h{display:flex;align-items:center;gap:10px;cursor:pointer}
.dc-h .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font:800 13px var(--f-display);flex:none}
.dc-h .tx{flex:1;min-width:0}
.dc-h .tx b{display:block;font-size:15px}
.dc-h .tx small{color:var(--muted);font-size:12.5px}
.dc-b{margin-top:12px;display:none}
.dc.aberto .dc-b{display:block}
.dc-g{font:700 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px}
.ops{display:flex;flex-wrap:wrap;gap:6px}
.ops button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font:600 13.5px var(--f-body);color:var(--ink);cursor:pointer}
.ops button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.saude{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;margin-top:10px}
.recolha{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:10px;line-height:1.55}
.diario-bar{position:sticky;bottom:72px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:14px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
@media(min-width:760px){.diario-bar{bottom:12px}}
</style>
</head>
<body>
<div id="root"><div class="carregar"><div class="spinner"></div>A abrir…</div></div>
<div class="toasts" id="toasts"></div>
<script src="pauta.js" charset="utf-8"></script>
<script src="chamada.js" charset="utf-8"></script>
<script>
(function(){
'use strict';
var PROXY='https://gescolar-proxy.onrender.com';
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function data(iso){ if(!iso) return '—'; var d=new Date(iso); return isNaN(d)?'—':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function iniciais(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+((p.length>1?p[p.length-1]:'')[0]||'')).toUpperCase(); }
var IC={car:'M5 17h14M6 17v2M18 17v2M3 13l2-6h14l2 6v4H3zM7.5 13h.01M16.5 13h.01',check:'M20 6 9 17l-5-5',list:'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01',home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',grade:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 15l2 2 4-4',cal:'M8 2v4M16 2v4M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',mega:'M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 9a3 3 0 0 1 0 6M19 6a7 7 0 0 1 0 12',book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75'};
function ic(n,x){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" '+(x||'')+'><path d="'+IC[n]+'"/></svg>'; }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.innerHTML='<i></i><span>'+esc(m)+'</span>'; $('#toasts').appendChild(t); setTimeout(function(){ t.remove(); },3600); }
function vazio(i,t,s){ return '<div class="vazio"><div class="ic">'+ic(i)+'</div><b>'+esc(t)+'</b>'+esc(s)+'</div>'; }
var DIAS_L=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'], DIAS_C=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function triActual(){ var m=new Date().getMonth()+1; return m<=5?1:(m<=8?2:3); }

/* ---------- sessão ---------- */
var SES=null; try{ SES=JSON.parse(localStorage.getItem('gs_sessao')||'null'); }catch(e){}
if(!SES || !SES.token){ location.replace('acesso.html'); return; }
function sair(){ try{ localStorage.removeItem('gs_sessao'); }catch(e){} location.replace('acesso.html'); }
function api(rota,corpo){
  return fetch(PROXY+rota,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SES.token},body:JSON.stringify(corpo||{})})
    .then(function(r){ return r.json().catch(function(){ return {ok:false,erro:'Resposta inválida do servidor.'}; }).then(function(d){ if(r.status===401) sair(); return d; }); })
    .catch(function(){ return {ok:false,erro:'Sem ligação ao servidor. Verifique a internet e tente de novo.'}; });
}

var S={ d:null, aba:'inicio', par:'', tri:triActual(), ed:null, dia:0 };
try{ var h=(location.hash||'').slice(1); if(h) S.aba=h; }catch(e){}
var ABAS=[['inicio','Início','home'],['chamada','Chamada','list'],['notas','Notas','grade'],['horario','Horário','cal'],['avisos','Avisos','mega']];
function soInstrutor(){ var d=S.d; return !!(d && d.conducao && !d.turmas.length && !d.aulas.length); }
function temESC(){ var d=S.d; return !!(d && d.turmas.some(function(t){ return t.esc; })); }
function soESC(){ var d=S.d; return !!(d && d.turmas.length && d.turmas.every(function(t){ return t.esc; })); }
function abasP(){ var d=S.d; if(soInstrutor()) return [['inicio','Início','home'],['praticas','Aulas','car'],['avisos','Avisos','mega']];
  if(soESC()) return [['inicio','Início','home'],['diario','Diário','book'],['chamada','Presenças','list'],['notas','Avaliação','grade'],['avisos','Avisos','mega']];
  var L = d && d.conducao ? ABAS.slice(0,4).concat([['praticas','Práticas','car'],ABAS[4]]) : ABAS.slice();
  if(temESC()) L.splice(1,0,['diario','Diário','book']);
  return L; }
function sujo(){ return (S.ed && S.ed.sujo()) || (S.ch && S.ch.sujo()) || !!(S.di && S.di.sujo); }
window.addEventListener('beforeunload',function(e){ if(sujo()){ e.preventDefault(); e.returnValue=''; } });

function carregar(){
  api('/prof/inicio').then(function(d){
    if(!d.ok){ $('#root').innerHTML='<div class="carregar">'+esc(d.erro||'Não foi possível abrir.')+' <a class="link" href="">Tentar de novo</a></div>'; return; }
    S.d=d; casca();
  });
}
function casca(){
  var d=S.d, E=d.escola;
  $('#root').innerHTML='<div class="pt"><header class="pt-top"><div class="in">'+
    '<div class="pt-row">'+(E.logotipo?'<div class="pt-logo"><img src="'+esc(E.logotipo)+'" alt=""></div>':'<div class="pt-logo ini">'+esc(iniciais(E.nome))+'</div>')+
      '<div class="pt-esc"><b>'+esc(E.nome)+'</b><small>'+(soInstrutor()?'Instrutor':'Professor')+' · '+esc(d.eu.nome)+'</small></div><button class="pt-sair" id="sair">'+ic('out')+'Sair</button></div>'+
    '<nav class="pt-tabs">'+abasP().map(function(a){ return '<button class="'+(S.aba===a[0]?'on':'')+'" data-aba="'+a[0]+'">'+ic(a[2])+a[1]+'</button>'; }).join('')+'</nav>'+
    '</div></header><main class="pt-main'+(S.aba==='notas'?' largo':'')+'" id="pg"></main>'+
    '<nav class="pt-nav" style="grid-template-columns:repeat('+abasP().length+',1fr)">'+abasP().map(function(a){ return '<button class="'+(S.aba===a[0]?'on':'')+'" data-aba="'+a[0]+'">'+ic(a[2])+a[1]+'</button>'; }).join('')+'</nav></div>';
  $('#sair').onclick=function(){ if(sujo() && !confirm('Tem notas por guardar. Sair mesmo assim?')) return; sair(); };
  $$('[data-aba]').forEach(function(b){ b.onclick=function(){ ir(b.getAttribute('data-aba')); }; });
  if(!abasP().some(function(a){ return a[0]===S.aba; })) S.aba='inicio';
  ({inicio:soInstrutor()?pInicioInstrutor:pInicio,chamada:pChamada,notas:pNotas,horario:pHorario,avisos:pAvisos,praticas:pPraticas,diario:pDiario}[S.aba]||pInicio)();
}
function ir(a){ if(a!==S.aba && sujo() && !confirm('Tem notas por guardar. Sair desta página mesmo assim?')) return; if(a!=='notas') S.ed=null; if(a!=='chamada') S.ch=null; if(a!=='diario') S.di=null; S.aba=a; try{ history.replaceState(null,'','#'+a); }catch(e){} casca(); window.scrollTo(0,0); }

function aulaHtml(a, agora, comChamada){ return '<div class="aula'+(agora?' agora':'')+'"><div class="hr">'+a.i+'<br>'+a.f+'</div><div class="barra" style="background:'+esc(a.cor)+'"></div><div class="tx"><b>'+esc(a.disciplina)+' · '+esc(a.turma)+(agora?' <span class="pill info">Agora</span>':'')+'</b><small>'+esc(a.sala||'Sala da turma')+'</small></div>'+
  (comChamada?'<button class="btn sm '+(a.chamada?'':'pri')+'" style="align-self:center" data-ch="'+esc(a.turma_id+'|'+a.tempo)+'">'+(a.chamada?ic('check')+'Feita':'Chamada')+'</button>':'')+'</div>'; }
function hm(x){ var p=x.split(':'); return (+p[0])*60+(+p[1]); }

/* ================= INÍCIO ================= */
function pInicio(){
  var d=S.d, hoje=new Date().getDay(), agoraM=new Date().getHours()*60+new Date().getMinutes();
  var deHoje=d.aulas.filter(function(a){ return a.dia===hoje; });
  $('#pg').innerHTML=
    '<div class="pt-hero"><span class="av" style="background:#0B2A4A">'+esc(iniciais(d.eu.nome))+'</span><div><b>Olá, '+esc(d.eu.nome.split(' ')[0])+'</b><span class="info">'+d.turmas.length+' turma(s)/disciplina(s) · '+d.aulas.length+' aulas por semana</span></div></div>'+
    '<div class="sec-t">Hoje · '+DIAS_L[hoje]+'</div>'+
    (deHoje.length? '<div class="lista">'+deHoje.map(function(a){ return aulaHtml(a, agoraM>=hm(a.i)&&agoraM<hm(a.f), true); }).join('')+'</div>' : vazio('cal','Sem aulas hoje', d.aulas.length?'Bom descanso.':'Quando a Direcção marcar o seu horário, as aulas aparecem aqui.'))+
    '<div class="sec-t">As minhas turmas</div>'+
    (d.turmas.length? '<div class="lista">'+d.turmas.map(function(t){ return '<div class="pt-it"><div style="width:6px;align-self:stretch;border-radius:4px;background:'+esc(t.cor)+'"></div><div class="tx"><b>'+esc(t.disciplina_nome)+' · '+esc(t.turma_nome)+'</b><small>'+t.estudantes+' estudantes</small></div>'+(t.esc?'<button class="btn sm pri" data-dir="'+esc(t.turma)+'">Diário</button>':'<button class="btn sm pri" data-lancar="'+esc(t.turma+'|'+t.disciplina)+'">Lançar notas</button>')+'</div>'; }).join('')+'</div>'
      : vazio('users','Ainda sem turmas','A Direcção liga-o às turmas pelo horário ou pelas disciplinas que dá. Fale com a secretaria.'));
  $$('[data-lancar]').forEach(function(b){ b.onclick=function(){ S.par=b.getAttribute('data-lancar'); ir('notas'); }; });
  $$('[data-dir]').forEach(function(b){ b.onclick=function(){ S.diTurma=b.getAttribute('data-dir'); ir('diario'); }; });
  $$('[data-ch]').forEach(function(b){ b.onclick=function(){ S.chData=S.d.hoje.data; S.chAula=b.getAttribute('data-ch'); ir('chamada'); }; });
}

/* ================= CHAMADA ================= */
function somaDias(data,n){ var d=new Date(data+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function pChamada(){
  var d=S.d, hoje=d.hoje.data;
  if(!d.aulas.length){ $('#pg').innerHTML='<div class="sec-t" style="margin-top:4px">Chamada</div>'+vazio('list','Ainda sem aulas no horário','A chamada faz-se pelas aulas do seu horário. Quando a Direcção o marcar, aparecem aqui.'); return; }
  S.chData=S.chData||hoje;
  var dia=new Date(S.chData+'T12:00:00Z').getUTCDay();
  var L=d.aulas.filter(function(a){ return a.dia===dia; });
  if(!L.some(function(a){ return a.turma_id+'|'+a.tempo===S.chAula; })){ var agoraM=new Date().getHours()*60+new Date().getMinutes(); var cur=L.filter(function(a){ return hm(a.i)<=agoraM; }).pop(); S.chAula=L.length?((cur||L[0]).turma_id+'|'+(cur||L[0]).tempo):''; }
  $('#pg').innerHTML='<div class="sec-t" style="margin-top:4px">Chamada</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input class="inp" type="date" id="ch-d" value="'+S.chData+'" min="'+somaDias(hoje,-14)+'" max="'+hoje+'" style="height:42px;flex:none">'+
    (L.length?'<select class="sel" id="ch-a" style="height:42px;flex:1;min-width:200px">'+L.map(function(a){ var k=a.turma_id+'|'+a.tempo; return '<option value="'+esc(k)+'"'+(k===S.chAula?' selected':'')+'>'+esc(a.i+' · '+a.disciplina+' · '+a.turma)+'</option>'; }).join('')+'</select>':'')+'</div>'+
    (L.length?'<section class="card card-b" id="ch"></section>':vazio('cal','Sem aulas neste dia','Escolha outra data. Pode fazer ou corrigir chamadas dos últimos 14 dias.'));
  $('#ch-d').onchange=function(){ var v=this.value; if(!v) return; if(sujo() && !confirm('Tem uma chamada por guardar. Mudar mesmo assim?')){ this.value=S.chData; return; } if(v>hoje||v<somaDias(hoje,-14)){ toast('Escolha uma data dos últimos 14 dias'); this.value=S.chData; return; } S.chData=v; S.chAula=''; S.ch=null; pChamada(); };
  var sa=$('#ch-a'); if(sa) sa.onchange=function(){ if(sujo() && !confirm('Tem uma chamada por guardar. Mudar mesmo assim?')){ this.value=S.chAula; return; } S.chAula=this.value; S.ch=null; abrir(); };
  if(L.length) abrir();
  function abrir(){
    var p=S.chAula.split('|'); $('#ch').innerHTML='<div class="carregar"><div class="spinner"></div>A abrir a chamada…</div>';
    api('/prof/chamada',{turma:p[0], data:S.chData, tempo:+p[1]}).then(function(r){
      if(!r.ok){ $('#ch').innerHTML='<div class="msg-err">'+esc(r.erro)+'</div>'; return; }
      S.ch=GSChamada.montar($('#ch'), r.chamada, { hoje:hoje, aviso:toast,
        guardar:function(m,sum,sms){ return api('/prof/chamada-guardar',{turma:p[0], data:S.chData, tempo:+p[1], marcas:m, sumario:sum, sms:sms}); },
        depois:function(){ if(S.chData===hoje) S.d.aulas.forEach(function(a){ if(a.turma_id===p[0] && a.tempo===+p[1] && a.dia===d.hoje.dia) a.chamada=true; }); } });
    });
  }
}

/* ================= NOTAS ================= */
function pNotas(){
  var d=S.d;
  if(!d.turmas.length){ $('#pg').innerHTML=vazio('grade','Ainda sem turmas','Quando a Direcção o ligar a uma turma, pode lançar as notas aqui.'); return; }
  if(!d.turmas.some(function(t){ return t.turma+'|'+t.disciplina===S.par; })) S.par=d.turmas[0].turma+'|'+d.turmas[0].disciplina;
  $('#pg').innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+
      '<select class="sel" id="n-par" style="flex:1;min-width:200px;height:42px">'+d.turmas.map(function(t){ var k=t.turma+'|'+t.disciplina; return '<option value="'+esc(k)+'"'+(k===S.par?' selected':'')+'>'+esc(t.disciplina_nome+' · '+t.turma_nome)+'</option>'; }).join('')+'</select>'+
      '<select class="sel" id="n-tri" style="height:42px">'+[1,2,3].map(function(t){ return '<option value="'+t+'"'+(t===S.tri?' selected':'')+'>'+t+'º trimestre</option>'; }).join('')+'</select></div>'+
    '<section class="card card-b" id="ed"><div class="carregar"><div class="spinner"></div>A abrir a pauta…</div></section>';
  function mudar(){ var np=$('#n-par').value, nt=+$('#n-tri').value; if(sujo() && !confirm('Tem notas por guardar. Mudar mesmo assim?')){ $('#n-par').value=S.par; $('#n-tri').value=S.tri; return; } S.par=np; S.tri=nt; abrir(); }
  $('#n-par').onchange=mudar; $('#n-tri').onchange=mudar;
  abrir();
  function abrir(){
    var p=S.par.split('|'); S.ed=null;
    $('#ed').innerHTML='<div class="carregar"><div class="spinner"></div>A abrir a pauta…</div>';
    api('/prof/pauta',{turma:p[0], disciplina:p[1], trimestre:S.tri}).then(function(r){
      if(!r.ok){ $('#ed').innerHTML='<div class="msg-err">'+esc(r.erro)+'</div>'; return; }
      S.ed=GSPauta.montar($('#ed'), r.pauta, { aviso:toast, guardar:function(g,pub){ return api('/prof/pauta-guardar',{turma:p[0], disciplina:p[1], trimestre:S.tri, grelha:g, publicado:pub}); } });
    });
  }
}


/* ================= DIÁRIO (ESCOLINHA) ================= */
var EMO={'Bem-disposto':'😊','Calmo':'🙂','Agitado':'😤','Choroso':'😢','Doente':'🤒'};
function pDiario(){
  var d=S.d, T={}, turmas=[];
  d.turmas.forEach(function(t){ if(t.esc && !T[t.turma]){ T[t.turma]=1; turmas.push(t); } });
  if(!turmas.length){ $('#pg').innerHTML=vazio('book','Sem turmas da escolinha','O diário é para as turmas da escolinha.'); return; }
  var hoje=d.hoje.data;
  if(!T[S.diTurma]) S.diTurma=turmas[0].turma;
  S.diData=S.diData||hoje;
  $('#pg').innerHTML='<div class="sec-t" style="margin-top:4px">Diário da turma</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
      (turmas.length>1?'<select class="sel" id="di-t" style="height:42px;flex:1;min-width:180px">'+turmas.map(function(t){ return '<option value="'+esc(t.turma)+'"'+(t.turma===S.diTurma?' selected':'')+'>'+esc(t.turma_nome)+'</option>'; }).join('')+'</select>':'<div style="flex:1;align-self:center;font-weight:700">'+esc(turmas[0].turma_nome)+'</div>')+
      '<input class="inp" type="date" id="di-d" value="'+S.diData+'" min="'+somaDias(hoje,-7)+'" max="'+hoje+'" style="height:42px;flex:none"></div>'+
    '<div id="di"><div class="carregar"><div class="spinner"></div>A abrir o diário…</div></div>';
  function trocar(f){ if(S.di && S.di.sujo && !confirm('Tem o diário por guardar. Mudar mesmo assim?')) return false; f(); S.di=null; abrir(); return true; }
  var st=$('#di-t'); if(st) st.onchange=function(){ var v=this.value; if(!trocar(function(){ S.diTurma=v; })) this.value=S.diTurma; };
  $('#di-d').onchange=function(){ var v=this.value; if(!v||v>hoje||v<somaDias(hoje,-7)){ toast('Escolha hoje ou um dos últimos 7 dias'); this.value=S.diData; return; }
    if(!trocar(function(){ S.diData=v; })) this.value=S.diData; };
  abrir();
  function abrir(){
    $('#di').innerHTML='<div class="carregar"><div class="spinner"></div>A abrir o diário…</div>';
    api('/prof/diario',{turma:S.diTurma, data:S.diData}).then(function(r){
      if(!r.ok){ $('#di').innerHTML='<div class="msg-err">'+esc(r.erro)+'</div>'; return; }
      montar(r);
    });
  }
  function montar(r){
    var O=r.opcoes, E={}, act=(r.criancas.filter(function(c){ return c.actividades; })[0]||{}).actividades||'';
    r.criancas.forEach(function(c){ E[c.id]={refeicao:c.refeicao, sesta:c.sesta, humor:c.humor, recado:c.recado}; });
    S.di={sujo:false};
    if(!r.criancas.length){ $('#di').innerHTML=vazio('users','Turma sem crianças','A secretaria ainda não inscreveu crianças nesta turma.'); return; }
    var feitos=r.criancas.filter(function(c){ return c.feito; }).length;
    function ops(id,campo,lista){ return '<div class="ops" data-c="'+esc(id)+'" data-campo="'+campo+'">'+lista.map(function(o){ return '<button type="button" class="'+(E[id][campo]===o?'on':'')+'" data-o="'+esc(o)+'">'+(campo==='humor'&&EMO[o]?EMO[o]+' ':'')+esc(o)+'</button>'; }).join('')+'</div>'; }
    function resumo(c){ var e=E[c.id], p=[e.refeicao,e.sesta,e.humor].filter(Boolean); return p.length? esc(p.join(' · ')) : '<span style="color:var(--warn)">Por preencher</span>'; }
    function tel(t){ return '<a href="tel:'+esc(String(t).replace(/\s/g,''))+'">'+esc(t)+'</a>'; }
    function recolha(c){ var p=[];
      if(c.encarregado) p.push('<b>'+esc(c.encarregado.nome)+'</b>'+(c.encarregado.parentesco?' ('+esc(c.encarregado.parentesco)+')':'')+(c.encarregado.telefone?' · '+tel(c.encarregado.telefone):'')+' · encarregado');
      c.autorizados.forEach(function(a){ p.push('<b>'+esc(a.nome)+'</b>'+(a.parentesco?' ('+esc(a.parentesco)+')':'')+(a.telefone?' · '+tel(a.telefone):'')); });
      return '<div class="recolha"><div class="dc-g" style="margin:0 0 4px">Quem pode recolher</div>'+(p.length?p.join('<br>'):'<span class="muted">Ninguém registado. Peça à secretaria.</span>')+'</div>'; }
    $('#di').innerHTML='<p class="small muted" style="margin:0 0 10px">'+feitos+' de '+r.criancas.length+' criança(s) com diário neste dia. Toque numa criança para escrever.</p>'+
      '<section class="card card-b" style="margin-bottom:12px"><label class="field" style="margin:0">O que fizemos hoje (vai para todas as famílias)<textarea class="inp" id="di-act" rows="3" maxlength="600" placeholder="Ex.: Pintámos com as mãos, cantámos as cores e brincámos no pátio.">'+esc(act)+'</textarea></label></section>'+
      '<div class="lista">'+r.criancas.map(function(c){ return '<div class="dc" data-dc="'+esc(c.id)+'"><div class="dc-h"><span class="av">'+esc(iniciais(c.nome))+'</span><div class="tx"><b>'+esc(c.nome)+'</b><small data-res="'+esc(c.id)+'">'+resumo(c)+'</small></div>'+(c.saude?'<span class="pill warn">Saúde</span>':'')+(c.feito?'<span class="pill ok">Feito</span>':'')+'</div>'+
        '<div class="dc-b">'+(c.saude?'<div class="saude">'+esc(c.saude)+'</div>':'')+
          '<div class="dc-g">Refeição</div>'+ops(c.id,'refeicao',O.refeicao)+'<div class="dc-g">Sesta</div>'+ops(c.id,'sesta',O.sesta)+'<div class="dc-g">Humor</div>'+ops(c.id,'humor',O.humor)+
          '<div class="dc-g">Recado para a família</div><textarea class="inp" rows="2" maxlength="400" data-rec="'+esc(c.id)+'" placeholder="Ex.: Precisa de fraldas amanhã.">'+esc(c.recado)+'</textarea>'+recolha(c)+'</div></div>'; }).join('')+'</div>'+
      '<div class="diario-bar"><span class="small muted" id="di-st">Sem alterações</span><button class="btn pri" id="di-g">'+ic('check')+'Guardar diário</button></div>';
    function marcar(){ S.di.sujo=true; var e=$('#di-st'); e.textContent='Alterações por guardar'; e.style.color='var(--warn)'; }
    $$('.dc-h').forEach(function(h){ h.onclick=function(){ h.parentNode.classList.toggle('aberto'); }; });
    $$('.ops').forEach(function(g){ var id=g.getAttribute('data-c'), campo=g.getAttribute('data-campo');
      $$('button',g).forEach(function(b){ b.onclick=function(){ var o=b.getAttribute('data-o'); E[id][campo]= E[id][campo]===o?'':o;
        $$('button',g).forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-o')===E[id][campo]); });
        var c=r.criancas.filter(function(z){ return z.id===id; })[0]; $('[data-res="'+id+'"]').innerHTML=resumo(c); marcar(); }; }); });
    $$('[data-rec]').forEach(function(t){ t.oninput=function(){ E[t.getAttribute('data-rec')].recado=t.value; marcar(); }; });
    $('#di-act').oninput=marcar;
    $('#di-g').onclick=function(){ var btn=this; btn.disabled=true;
      api('/prof/diario-guardar',{turma:S.diTurma, data:S.diData, actividades:$('#di-act').value, entradas:E}).then(function(x){ btn.disabled=false;
        if(!x.ok){ toast(x.erro); return; } S.di.sujo=false; toast('Diário guardado · '+x.guardados+' criança(s)'); abrir(); }); };
  }
}

/* ================= INSTRUTOR (ESCOLA DE CONDUÇÃO) ================= */
var EST_P={marcada:['Marcada','info'],feita:['Feita','ok'],faltou:['Faltou','bad']};
function linhaPratica(a, hoje){
  var e=EST_P[a.estado]||[a.estado,'muted'];
  return '<div class="aula"><div class="hr">'+esc(a.inicio)+'<br>'+esc(a.fim)+'</div><div class="barra" style="background:'+(a.estado==='feita'?'var(--ok)':a.estado==='faltou'?'var(--bad)':'var(--blue)')+'"></div>'+
    '<div class="tx"><b>'+esc(a.instruendo)+' <span class="pill '+e[1]+'">'+e[0]+'</span></b><small>Carta '+esc(a.categoria)+' · '+esc(a.viatura)+(a.modelo?' '+esc(a.modelo):'')+(a.telefone?' · <a href="tel:'+esc(String(a.telefone).replace(/\s/g,''))+'">'+esc(a.telefone)+'</a>':'')+'</small>'+
    (a.data<=hoje ? (a.estado==='marcada' ? '<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm pri" data-ap="'+esc(a.id)+'" data-v="feita">Feita</button><button class="btn sm" data-ap="'+esc(a.id)+'" data-v="faltou">Faltou</button></div>'
      : '<div style="margin-top:6px"><button class="btn sm ghost" data-ap="'+esc(a.id)+'" data-v="marcada">Desfazer</button></div>') : '')+'</div></div>';
}
function ligarPraticas(depois){
  $$('[data-ap]').forEach(function(b){ b.onclick=function(){ var v=b.getAttribute('data-v'), id=b.getAttribute('data-ap'); b.disabled=true;
    api('/prof/aula-estado',{id:id, estado:v}).then(function(r){ if(!r.ok){ toast(r.erro); b.disabled=false; return; }
      S.d.conducao.aulas.forEach(function(a){ if(a.id===id) a.estado=v; }); toast(v==='feita'?'Aula registada como feita':v==='faltou'?'Falta registada':'Registo desfeito'); depois(); }); }; });
}
function pInicioInstrutor(){
  var c=S.d.conducao, hoje=c.hoje, L=c.aulas.filter(function(a){ return a.data===hoje; });
  var pend=c.aulas.filter(function(a){ return a.data<hoje && a.estado==='marcada'; });
  $('#pg').innerHTML='<div class="pt-hero"><span class="av" style="background:#0B2A4A">'+esc(iniciais(S.d.eu.nome))+'</span><div><b>Olá, '+esc(S.d.eu.nome.split(' ')[0])+'</b><span class="info">'+c.feitas_mes+' aula(s) dadas este mês</span></div></div>'+
    '<div class="sec-t">Hoje · '+DIAS_L[new Date(hoje+'T12:00:00Z').getUTCDay()]+'</div>'+
    (L.length? '<div class="lista">'+L.map(function(a){ return linhaPratica(a,hoje); }).join('')+'</div>' : vazio('car','Sem aulas hoje','As aulas que a escola marcar consigo aparecem aqui.'))+
    (pend.length? '<div class="sec-t" style="color:var(--bad)">Por registar (dias anteriores)</div><div class="lista">'+pend.map(function(a){ return '<div style="padding:6px 14px 0" class="small muted">'+esc(a.data.slice(8,10)+'/'+a.data.slice(5,7))+'</div>'+linhaPratica(a,hoje); }).join('')+'</div>' : '');
  ligarPraticas(pInicioInstrutor);
}
function pPraticas(){
  var c=S.d.conducao; if(!c){ $('#pg').innerHTML=vazio('car','Sem aulas práticas',''); return; }
  var hoje=c.hoje, dias={}; c.aulas.forEach(function(a){ (dias[a.data]=dias[a.data]||[]).push(a); });
  var ks=Object.keys(dias).sort();
  $('#pg').innerHTML='<div class="sec-t" style="margin-top:4px">Aulas práticas · últimos e próximos 7 dias</div>'+
    (ks.length? ks.map(function(k){ return '<div class="sec-t" style="font-size:14px;margin:16px 0 8px">'+DIAS_L[new Date(k+'T12:00:00Z').getUTCDay()]+', '+k.slice(8,10)+'/'+k.slice(5,7)+(k===hoje?' · <span style="color:var(--blue)">hoje</span>':'')+'</div><div class="lista">'+dias[k].map(function(a){ return linhaPratica(a,hoje); }).join('')+'</div>'; }).join('')
      : vazio('car','Sem aulas neste período','As aulas marcadas pela escola aparecem aqui.'));
  ligarPraticas(pPraticas);
}

/* ================= HORÁRIO ================= */
function pHorario(){
  var A=S.d.aulas;
  if(!A.length){ $('#pg').innerHTML='<div class="sec-t" style="margin-top:4px">O meu horário</div>'+vazio('cal','Ainda sem horário','Quando a Direcção marcar as suas aulas no horário das turmas, aparecem aqui.'); return; }
  var dias=[]; A.forEach(function(a){ if(dias.indexOf(a.dia)<0) dias.push(a.dia); }); dias.sort();
  var hoje=new Date().getDay(); if(!S.dia || dias.indexOf(S.dia)<0) S.dia = dias.indexOf(hoje)>=0?hoje:dias[0];
  var agoraM=new Date().getHours()*60+new Date().getMinutes();
  var L=A.filter(function(a){ return a.dia===S.dia; });
  $('#pg').innerHTML='<div class="sec-t" style="margin-top:4px">O meu horário <span class="small muted" style="font:500 13px var(--f-body)">'+A.length+' aulas por semana</span></div>'+
    '<div class="dias">'+dias.map(function(d){ return '<button class="'+(d===S.dia?'on ':'')+(d===hoje?'hoje':'')+'" data-dia="'+d+'">'+DIAS_C[d]+'</button>'; }).join('')+'</div>'+
    '<div class="lista">'+L.map(function(a){ return aulaHtml(a, S.dia===hoje && agoraM>=hm(a.i) && agoraM<hm(a.f)); }).join('')+'</div>';
  $$('[data-dia]').forEach(function(b){ b.onclick=function(){ S.dia=+b.getAttribute('data-dia'); pHorario(); }; });
}

/* ================= AVISOS ================= */
function pAvisos(){
  var L=S.d.comunicados;
  $('#pg').innerHTML='<div class="sec-t" style="margin-top:4px">Comunicados da escola</div>'+
    (L.length? '<div class="lista">'+L.map(function(c){ return '<div class="com-it"><b>'+esc(c.titulo)+'</b><small>'+data(c.data)+' · '+esc(c.autor)+'</small><p>'+esc(c.texto)+'</p></div>'; }).join('')+'</div>' : vazio('mega','Sem comunicados','Os avisos da Direcção para toda a escola aparecem aqui.'));
}

/* ---------- arranque ---------- */
if(typeof window.GSPauta==='undefined' || typeof window.GSChamada==='undefined'){ $('#root').innerHTML='<div class="carregar">Faltam os ficheiros pauta.js ou chamada.js no site. Avise a Direcção.</div>'; return; }
fetch(PROXY+'/sessao',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SES.token}})
  .then(function(r){ return r.json().then(function(d){ return {st:r.status,d:d}; }); })
  .then(function(x){
    var d=x.d;
    if(x.st===401) return sair();
    if(!d.ok){ $('#root').innerHTML='<div class="carregar">'+esc(d.erro||'Não foi possível abrir.')+' <a class="link" href="acesso.html">Entrar outra vez</a></div>'; return; }
    if(d.pagina!=='professor'){ location.replace((d.pagina||'entrar')+'.html'); return; }
    SES.token=d.token; try{ localStorage.setItem('gs_sessao',JSON.stringify({token:d.token,nome:d.nome,papel:d.papel,pagina:'professor',escola:d.escola,criada:Date.now()})); }catch(e){}
    carregar();
  })
  .catch(function(){ $('#root').innerHTML='<div class="carregar">Sem ligação ao servidor do Gescolar. Na primeira vez do dia pode demorar alguns segundos. <a class="link" href="">Tentar de novo</a></div>'; });
})();
</script>
