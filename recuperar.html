<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova palavra-passe · Gescolar</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="gescolar.css">
<style>
body{background:var(--bg);margin:0}
.ac{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px;box-sizing:border-box}
.ac-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;text-decoration:none;color:var(--ink)}
.ac-brand img{width:44px;height:44px;border-radius:50%;background:#fff}
.ac-brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.ac-brand b i{font-style:normal;color:var(--sun)}
.ac-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 22px}
.ac-card h1{font-family:var(--f-display);font-size:23px;font-weight:800;margin:0;letter-spacing:-.01em}
.ac-card p.sub{color:var(--muted);margin:6px 0 20px;font-size:15px}
.ac-tipo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--surface2,#EEF2F8);border-radius:12px;padding:5px;margin-bottom:18px}
.ac-tipo button{border:0;background:none;border-radius:9px;padding:10px 4px;font:700 13.5px var(--f-body);color:var(--muted);cursor:pointer}
.ac-tipo button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(10,30,60,.12)}
.ac-card .field{margin-bottom:14px}
.ac-card .inp{height:46px;font-size:16px}
.ac-card .btn.pri{width:100%;height:48px;justify-content:center;font-size:16px}
.ac-cod{font-family:var(--f-mono)!important;font-size:28px!important;letter-spacing:.42em;text-align:center;height:60px!important}
.ac-msg{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:14px}
.ac-msg.err{background:var(--bad-soft);color:var(--bad)}
.ac-msg.ok{background:var(--ok-soft);color:var(--ok)}
.ac-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:14px}
.ac-row button,.ac-row a{background:none;border:0;padding:0;color:var(--blue);font:600 14px var(--f-body);cursor:pointer;text-decoration:none}
.ac-row button[disabled]{color:var(--muted);cursor:default}
.ac-foot{max-width:430px;text-align:center;color:var(--muted);font-size:13px;margin-top:18px;line-height:1.5}
.ac-foot a{color:var(--blue);font-weight:600;text-decoration:none}
.ac-hint{font-size:12.5px;color:var(--muted);font-weight:500}
</style>

</head>
<body>
<div class="ac">
  <a class="ac-brand" href="index.html"><img src="logo.png" alt=""><b>G<i>e</i>scolar</b></a>
  <div class="ac-card" id="card"></div>
  <div class="ac-foot">Lembrou-se? <a href="entrar.html">Voltar a entrar</a></div>
</div>
<script>
(function(){
'use strict';
var PROXY='https://gescolar-proxy.onrender.com';
function $(s){ return document.querySelector(s); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function post(rota,corpo){
  return fetch(PROXY+rota,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo||{})})
    .then(function(r){ return r.json().catch(function(){ return {ok:false,erro:'Resposta inválida do servidor.'}; }); })
    .catch(function(){ return {ok:false,erro:'Sem ligação ao servidor. Verifique a internet. Na primeira vez do dia pode demorar alguns segundos.'}; });
}
function carregar(btn,sim,txt){ if(sim){ btn.disabled=true; btn.dataset.t=btn.innerHTML; btn.innerHTML='<span class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></span>'+(txt||''); } else { btn.disabled=false; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
var S={ email:'', pedido:'', destino:'', espera:0, timer:null };
try{ S.email=new URLSearchParams(location.search).get('email')||''; }catch(e){}

function passo1(erro){
  clearInterval(S.timer);
  $('#card').innerHTML='<h1>Criar uma nova palavra-passe</h1><p class="sub">Escreva o email da sua conta. Enviamos um código por SMS para o telemóvel registado.</p>'+
    (erro?'<div class="ac-msg err">'+esc(erro)+'</div>':'')+
    '<form id="f1" novalidate><label class="field">Email<input class="inp" id="r-e" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="'+esc(S.email)+'" placeholder="direccao@escola.co.mz"></label>'+
    '<button class="btn pri" id="b1" type="submit">Receber código por SMS</button></form>';
  $('#f1').onsubmit=function(ev){ ev.preventDefault(); pedir(); };
  setTimeout(function(){ $('#r-e').focus(); },30);
}
function pedir(reenviar){
  if(!reenviar){ S.email=($('#r-e').value||'').trim().toLowerCase(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email)) return passo1('Escreva um email válido.'); }
  var btn=reenviar?$('#reenv'):$('#b1'); if(btn) carregar(btn,true,reenviar?'':' A enviar…');
  post('/senha-pedir',{email:S.email}).then(function(r){
    if(!r.ok){ if(reenviar) passo2(r.erro); else passo1(r.erro); return; }
    S.pedido=r.pedido; S.destino=r.destino; S.espera=60; passo2(null, reenviar?'Enviámos um código novo.':'');
  });
}
function passo2(erro, okMsg){
  $('#card').innerHTML='<h1>Escreva o código e a nova palavra-passe</h1><p class="sub">Enviámos um SMS com 6 números para <b class="mono" style="color:var(--ink)">'+esc(S.destino)+'</b>.</p>'+
    (erro?'<div class="ac-msg err">'+esc(erro)+'</div>':'')+(okMsg?'<div class="ac-msg ok">'+esc(okMsg)+'</div>':'')+
    '<form id="f2" novalidate><label class="field">Código do SMS<input class="inp ac-cod" id="r-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······"></label>'+
    '<label class="field">Nova palavra-passe<input class="inp" id="r-p" type="password" autocomplete="new-password" minlength="8" placeholder="Pelo menos 8 caracteres"></label>'+
    '<label class="field">Repita a palavra-passe<input class="inp" id="r-p2" type="password" autocomplete="new-password"></label>'+
    '<label class="small" style="display:flex;gap:8px;align-items:center;margin:-4px 0 14px;color:var(--muted)"><input type="checkbox" id="r-ver"> Mostrar a palavra-passe</label>'+
    '<button class="btn pri" id="b2" type="submit">Guardar e entrar</button></form>'+
    '<div class="ac-row"><button type="button" id="voltar">← Outro email</button><button type="button" id="reenv" disabled>Reenviar</button></div>';
  $('#voltar').onclick=function(){ passo1(); };
  $('#reenv').onclick=function(){ pedir(true); };
  $('#r-c').oninput=function(){ this.value=this.value.replace(/\D/g,'').slice(0,6); };
  $('#r-ver').onchange=function(){ var t=this.checked?'text':'password'; $('#r-p').type=t; $('#r-p2').type=t; };
  $('#f2').onsubmit=function(ev){ ev.preventDefault(); guardar(); };
  setTimeout(function(){ $('#r-c').focus(); },30);
  clearInterval(S.timer);
  function tic(){ var b=$('#reenv'); if(!b){ clearInterval(S.timer); return; } if(S.espera>0){ b.disabled=true; b.textContent='Reenviar em '+S.espera+' s'; S.espera--; } else { b.disabled=false; b.textContent='Reenviar o código'; clearInterval(S.timer); } }
  tic(); S.timer=setInterval(tic,1000);
}
function msg(t){ var m=document.querySelector('.ac-msg'); if(m) m.remove(); $('#f2').insertAdjacentHTML('beforebegin','<div class="ac-msg err">'+esc(t)+'</div>'); }
function guardar(){
  var c=($('#r-c').value||'').replace(/\D/g,''), p=$('#r-p').value, p2=$('#r-p2').value;
  if(c.length!==6) return msg('Escreva os 6 números do SMS.');
  if(p.length<8) return msg('A palavra-passe tem de ter pelo menos 8 caracteres.');
  if(p!==p2) return msg('As duas palavras-passe não são iguais.');
  var btn=$('#b2'); carregar(btn,true,' A guardar…');
  post('/senha-nova',{pedido:S.pedido, codigo:c, password:p}).then(function(r){
    if(!r.ok){ if(/expirou|Demasiadas/.test(r.erro||'')){ passo1(r.erro); return; } carregar(btn,false); msg(r.erro); return; }
    clearInterval(S.timer);
    try{ localStorage.setItem('gs_sessao',JSON.stringify({token:r.token,nome:r.nome,papel:r.papel,pagina:r.pagina,escola:r.escola,criada:Date.now()})); }catch(e){}
    $('#card').innerHTML='<h1>Palavra-passe criada</h1><p class="sub">Já pode entrar sempre com o email e a nova palavra-passe. A abrir o seu painel…</p>';
    setTimeout(function(){ location.replace((r.pagina||'entrar')+'.html'); },1200);
  });
}
passo1();
})();
</script>
</body>
</html>
