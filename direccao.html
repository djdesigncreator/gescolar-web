<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Direcção · Gescolar</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="gescolar.css">
<style>
.nav button.soon{opacity:.55;cursor:default}
.nav button.soon:hover{background:none}
.nav button.soon span:first-of-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav .em-breve{flex:none;margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.passo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.passo:last-child{border-bottom:0}
.passo .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;border:2px solid var(--line);color:var(--muted)}
.passo.feito .n{background:var(--ok);border-color:var(--ok);color:#fff}
.passo.agora .n{background:var(--sun);border-color:var(--sun);color:#2c2000}
.passo b{display:block;font-size:15.5px}
.passo small{color:var(--muted)}
.carregar{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 16px;color:var(--muted)}
.carregar .spinner{margin:0;width:28px;height:28px;border-width:3px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px}
.chk label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hg{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
.hg th{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 4px;text-align:center}
.hg td.t{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;padding-right:8px;width:96px}
.hg td.c{height:58px;border:1.5px dashed var(--line);border-radius:9px;cursor:pointer;vertical-align:top;padding:6px 8px;font-size:13px;line-height:1.25;background:var(--surface)}
.hg td.c:hover{border-color:var(--blue)}
.hg td.c.on{border-style:solid;border-left-width:5px}
.hg td.c b{display:block;font-size:13.5px;color:var(--ink)}
.hg td.c small{color:var(--muted);font-size:11.5px;display:block}
.hg td.c .mais{color:var(--muted);font-size:20px;display:grid;place-items:center;height:100%}
.tempo{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.tempo .inp{height:34px;font-family:var(--f-mono);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.carga{display:flex;flex-wrap:wrap;gap:6px}
.carga span{font-size:12.5px;border-radius:6px;padding:3px 8px;background:var(--surface2,#EEF2F8);border:1px solid var(--line)}
.carga span.ok{border-color:var(--ok);color:var(--ok)}
.carga span.falta{border-color:var(--warn);color:var(--warn)}
.com{padding:16px 18px;border-bottom:1px solid var(--line)}
.com:last-child{border-bottom:0}
.com h4{margin:0 0 4px;font-size:16px}
.com p{margin:8px 0 0;white-space:pre-wrap;color:var(--ink);font-size:14.5px;line-height:1.5}
textarea.inp{height:auto;min-height:130px;padding:10px;line-height:1.45;resize:vertical}
.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.mx th,.mx td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--surface)}
.mx thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;z-index:2}
.mx th.nm,.mx td.nm{text-align:left;position:sticky;left:0;z-index:1;border-right:1px solid var(--line);min-width:180px}
.mx thead th.nm{z-index:3}
.mx th.dc{cursor:pointer;border-top:4px solid transparent}
.mx th.dc:hover{color:var(--blue)}
.mx td.v{font:700 13.5px var(--f-mono)}
.mx .neg{color:var(--bad)} .mx .pos{color:var(--ok)}
.dcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.dc-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.dc-card:hover{border-color:var(--blue)}
.dc-card b{display:block;font-size:14.5px}
.dc-card small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media print{.side,.top,.ph .actions,.dcs,.no-print{display:none!important}.app{display:block}.main{margin:0}.page{padding:0}.card{box-shadow:none}}
.pn-lista{display:flex;flex-direction:column}
.pn-it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pn-it:last-child{border-bottom:0}
.pn-it .tx{flex:1;min-width:0}
.pn-it .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-it .tx small{color:var(--muted);font-size:12.5px}
.pn-it .vl{font:700 14px var(--f-mono);white-space:nowrap}
.pn-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.pn-bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.pn-ch{position:relative}
.pn-ch svg{display:block;width:100%;height:auto;overflow:visible}
.pn-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.pn-vazio{color:var(--muted);font-size:14px;padding:6px 0}
.kpi .v.bad{color:var(--bad)} .kpi .v.ok{color:var(--ok)}
.msg-err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="root"><div class="carregar"><div class="spinner"></div>A abrir o painel…</div></div>
<div class="toasts" id="toasts"></div>
<script src="pauta.js" charset="utf-8"></script>
<script src="chamada.js" charset="utf-8"></script>
<script>
(function(){
'use strict';
var PROXY = 'https://gescolar-proxy.onrender.com';

/* ---------- utilidades ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function grp(n){ return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function mt(n){ return grp(n)+' MT'; }
function data(iso){ if(!iso) return '—'; var d=new Date(iso); return isNaN(d)?'—':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function iniciais(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+((p.length>1?p[p.length-1]:'')[0]||'')).toUpperCase(); }
var CORES=['#0A64DC','#0E7C86','#7B4DD6','#C2410C','#168A52','#B4235A','#0B2A4A','#8A6D00'];
function av(n){ var h=0; for(var i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return '<span class="av" style="background:'+CORES[h%CORES.length]+'">'+esc(iniciais(n))+'</span>'; }
var IC={home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',layers:'M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5',book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15zM6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5',board:'M2 3h20M4 3v11h16V3M12 14v4M8 21l4-3 4 3',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',cal:'M8 2v4M16 2v4M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',grade:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 15l2 2 4-4',wallet:'M20 7H5a2 2 0 0 1 0-4h13v4M3 5v14a2 2 0 0 0 2 2h15V7M16 14h.01',receipt:'M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-1 .7-3-2-3 2-3-2-3 2-3-2zM8 8h8M8 12h8M8 16h5',mega:'M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 9a3 3 0 0 1 0 6M19 6a7 7 0 0 1 0 12',cog:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',plus:'M12 5v14M5 12h14',x:'M18 6 6 18M6 6l12 12',menu:'M3 6h18M3 12h18M3 18h18',save:'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8',check:'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',sparkle:'M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z'};
IC.car='M5 17h14M6 17v2M18 17v2M3 13l2-6h14l2 6v4H3zM7.5 13h.01M16.5 13h.01'; IC.download='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3'; IC.image='M3 5h18v14H3zM8.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M21 15l-5-5L5 19';
function ic(n,x){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" '+(x||'')+'><path d="'+IC[n]+'"/></svg>'; }
function pl(n,a,b){ return n+' '+(n===1?a:b); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.innerHTML='<i></i><span>'+esc(m)+'</span>'; $('#toasts').appendChild(t); setTimeout(function(){ t.remove(); },3600); }

var NIVEL = { ESC:'Escolinha', PRI:'Ensino Primário', SEC:'Ensino Secundário', TEC:'Técnico-Profissional', SUP:'Ensino Superior', CON:'Escola de Condução' };
var TEM_MODELO = { ESC:1, PRI:1, SEC:1 };
var TERMO = { ESC:'área', SUP:'cadeira', TEC:'módulo', CON:'módulo' };

/* ---------- sessão ---------- */
var SES = null;
try{ SES = JSON.parse(localStorage.getItem('gs_sessao')||'null'); }catch(e){}
if(!SES || !SES.token){ location.replace('entrar.html'); return; }
function sair(){ try{ localStorage.removeItem('gs_sessao'); }catch(e){} location.replace('entrar.html'); }

function api(rota, corpo){
  return fetch(PROXY+rota, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+SES.token}, body:JSON.stringify(corpo||{}) })
    .then(function(r){ return r.json().catch(function(){ return {ok:false,erro:'Resposta inválida do servidor.'}; }).then(function(d){ if(r.status===401){ sair(); } return d; }); })
    .catch(function(){ return {ok:false, erro:'Sem ligação ao servidor. Verifique a internet e tente de novo.'}; });
}

/* ---------- estado ---------- */
var S = { pag:'painel', escola:null, nome:'', painel:null, turmas:null, disciplinas:null, professores:null, estudantes:null, filtroTurma:'' };
try{ var h=(location.hash||'').slice(1); if(h) S.pag=h; }catch(e){}

/* ---------- casca ---------- */
var NAV = [['Arranque'],['painel','Painel','home'],['turmas','Turmas e salas','layers'],['disciplinas','Disciplinas','book'],['professores','Professores','board'],['estudantes','Estudantes','users'],
  ['Financeiro'],['propinas','Propinas e multas','wallet'],['facturas','Facturas e recibos','receipt'],
  ['Escola'],['horarios','Horários','cal'],['presencas','Presenças e faltas','check'],['pautas','Pautas e notas','grade'],['comunicados','Comunicados','mega'],
  ['Conta'],['equipa','Equipa da escola','users',0,1],['assinatura','Assinatura do Gescolar','receipt',0,1]];
function temCON(){ return ((S.escola&&S.escola.niveis)||[]).indexOf('CON')>=0; }
function soCON(){ var n=(S.escola&&S.escola.niveis)||[]; return n.length>0 && n.every(function(x){ return x==='CON'; }); }
var SO_ESCOLA={turmas:1,disciplinas:1,estudantes:1,horarios:1,presencas:1,pautas:1};
function navLista(){
  var L=[];
  NAV.forEach(function(n){
    if(n.length>1 && soCON() && SO_ESCOLA[n[0]]) return;
    if(n[0]==='professores' && soCON()) n=['professores','Instrutores','board'];
    L.push(n);
    if(n[0]==='estudantes' || (soCON() && n[0]==='professores')){}
  });
  if(temCON()){ var i=L.map(function(n){ return n[0]; }).indexOf('Financeiro'); L.splice(i,0,['Condução'],['cursos','Cursos e categorias','layers'],['instruendos','Instruendos','users'],['aulas','Aulas práticas','cal'],['exames','Exames','grade'],['viaturas','Viaturas','car']); }
  return L;
}
function casca(){
  var e=S.escola||{};
  $('#root').innerHTML='<div class="app"><aside class="side" id="side">'+
    '<div class="brand"><img src="logo.png" alt=""><div><b>G<i>e</i>scolar</b><small>gescolar.co.mz</small></div></div>'+
    '<div class="school"><strong>'+esc(e.nome||'')+'</strong><span>'+esc((e.subdominio||'')+'.gescolar.co.mz · '+(e.ano||''))+'</span></div>'+
    '<nav class="nav">'+navLista().filter(function(n){ return S.papel==='Direccao' || (!n[4] && !(n.length===1 && n[0]==='Conta')); }).map(function(n){ if(n.length===1) return '<div class="grp">'+n[0]+'</div>';
      if(n[3]) return '<button class="soon" type="button" tabindex="-1">'+ic(n[2])+'<span>'+n[1]+'</span><span class="em-breve">em breve</span></button>';
      return '<button type="button" class="'+(S.pag===n[0]?'on':'')+'" data-go="'+n[0]+'">'+ic(n[2])+'<span>'+n[1]+'</span></button>'; }).join('')+'</nav>'+
    '<div class="me">'+av(S.nome||'?')+'<div class="who"><strong>'+esc(S.nome)+'</strong><span>Direcção</span></div></div>'+
    '<a class="exit" href="#" id="sair">'+ic('out','width="14" height="14"')+'Sair</a></aside>'+
    '<div class="main"><header class="top"><button class="menu-btn" id="menu" aria-label="Menu">'+ic('menu','width="18" height="18"')+'</button>'+
    '<div class="top-title">'+ic('layers','width="16" height="16" style="color:var(--blue)"')+'Área da Direcção</div>'+
    seloSituacao(e)+(S.plataforma?'<a class="btn sm" href="plataforma.html" style="margin-left:8px;text-decoration:none">Plataforma</a>':'')+
    '</header><main class="page" id="page"></main></div></div>';
  $('#sair').onclick=function(ev){ ev.preventDefault(); sair(); };
  $('#menu').onclick=function(ev){ ev.stopPropagation(); $('#side').classList.toggle('open'); };
  $$('[data-go]').forEach(function(b){ b.onclick=function(){ ir(b.getAttribute('data-go')); }; });
  pagina();
}
function ir(p){ S.pag=p; try{ history.replaceState(null,'','#'+p); }catch(e){} var sd=$('#side'); if(sd) sd.classList.remove('open'); casca(); window.scrollTo(0,0); }
function aCarregar(){ $('#page').innerHTML='<div class="carregar"><div class="spinner"></div>A carregar…</div>'; }
function ph(eb,t,sub,acc){ return '<div class="ph"><div><div class="eyebrow">'+eb+'</div><h1>'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><div class="actions">'+(acc||'')+'</div></div>'; }
function erroCaixa(m){ return '<div class="msg-err">'+esc(m)+'</div>'; }

/* ---------- modal ---------- */
function modal(html){ fechar(); var s=document.createElement('div'); s.className='scrim'; s.id='ov'; s.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>'; s.addEventListener('mousedown',function(e){ if(e.target===s) fechar(); }); document.body.appendChild(s); var f=s.querySelector('input,select'); if(f) setTimeout(function(){ f.focus(); },30); $$('[data-fechar]',s).forEach(function(b){ b.onclick=fechar; }); return s; }
function fechar(){ var o=$('#ov'); if(o) o.remove(); }
function aGravar(btn, sim){ if(sim){ btn.disabled=true; btn.dataset.txt=btn.innerHTML; btn.innerHTML='A gravar…'; } else { btn.disabled=false; if(btn.dataset.txt) btn.innerHTML=btn.dataset.txt; } }
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(window.__gsSujo && window.__gsSujo() && ($('#pe')||$('#cq'))) return; fechar(); } });

/* ---------- páginas ---------- */
function pagina(){
  var f = { painel:pPainel, turmas:pTurmas, disciplinas:pDisciplinas, professores:pProfessores, estudantes:pEstudantes, propinas:pPropinas, facturas:pFacturas, horarios:pHorarios, presencas:pPresencas, pautas:pPautas, comunicados:pComunicados, assinatura:pAssinatura, equipa:pEquipa, cursos:pCursos, instruendos:pInstruendos, aulas:pAulas, viaturas:pViaturas, exames:pExames }[S.pag] || pPainel;
  f();
}

// PAINEL — arranque guiado
function pPainel(){
  aCarregar();
  api('/painel').then(function(d){
    if(!d.ok){ $('#page').innerHTML=erroCaixa(d.erro); return; }
    S.painel=d; S.escola=d.escola||S.escola;
    var c=d.contagem, passos=soCON()?[
      ['cursos','Criar os cursos de condução','Uma linha por categoria INATRO: preço, prestações, aulas teóricas e práticas.',c.cursos,'curso','cursos'],
      ['professores','Registar os instrutores','Com o telemóvel: cada instrutor recebe o acesso por SMS.',c.professores,'instrutor','instrutores'],
      ['instruendos','Inscrever os instruendos','Cada inscrição cria as prestações e envia o número ao instruendo por SMS.',c.instruendos,'instruendo','instruendos']]:[
      ['turmas','Criar as turmas e salas','Cada turma tem o nível, o turno, a sala e a propina mensal.',c.turmas,'turma'],
      ['disciplinas','Criar as disciplinas','Pode carregar o currículo modelo de cada nível e ajustar depois.',c.disciplinas,'disciplina'],
      ['professores','Registar os professores','Com as disciplinas que cada um pode dar e o telemóvel para entrar.',c.professores,'professor'],
      ['estudantes','Matricular os estudantes','Cada estudante recebe o número e fica ligado ao encarregado.',c.estudantes,'estudante']];
    var prox=-1; passos.forEach(function(p,i){ if(prox<0 && !p[3]) prox=i; });
    var falta=passos.filter(function(p){ return !p[3]; }).length;
    var primeiro=(S.nome||'').split(' ')[0];
    var arranque = '<section class="card" style="margin-bottom:16px">'+passos.map(function(p,i){ var st=p[3]?'feito':(i===prox?'agora':'');
        return '<div class="passo '+st+'"><span class="n">'+(p[3]?'✓':(i+1))+'</span><div><b>'+p[1]+'</b><small>'+(p[3]?p[3]+' '+(p[3]===1?p[4]:(p[5]||p[4]+'s'))+' registad'+(p[4]==='disciplina'||p[4]==='turma'?'a':'o')+(p[3]===1?'':'s'):p[2])+'</small></div>'+
          '<button class="btn '+(i===prox?'pri':'')+' sm" data-go2="'+p[0]+'">'+(p[3]?'Ver':'Começar')+'</button></div>'; }).join('')+'</section>';
    $('#page').innerHTML = ph('Painel da Direcção','Olá, '+esc(primeiro), falta ? 'Faltam <b>'+falta+' '+(falta===1?'passo':'passos')+'</b> para a '+esc(S.escola.nome)+' funcionar em pleno.' : esc(S.escola.nome)+' · '+(soCON()? pl(c.instruendos,'instruendo em curso','instruendos em curso')+' · '+pl(c.cursos,'curso','cursos')+' · '+pl(c.professores,'instrutor','instrutores') : pl(c.estudantes,'estudante','estudantes')+' · '+pl(c.turmas,'turma','turmas')+' · '+pl(c.professores,'professor','professores'))+'.',
        '<button class="btn" id="pn-r">Actualizar</button>')+

var MESES_AB=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function barrasSvg(serie, rotulo, valor, fmtv, dest){
  // um só série, uma cor (azul da marca); barras finas com topo arredondado; rótulo só na barra de destaque
  var W=560, H=190, pl=8, pr=8, pt=26, pb=26, n=serie.length, max=Math.max.apply(null,serie.map(valor).concat([1]));
  var bw=Math.min(46,(W-pl-pr)/n*0.56), step=(W-pl-pr)/n;
  var out='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de barras"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)" stroke-width="1"/>';
  serie.forEach(function(x,i){
    var v=valor(x), h=Math.round((H-pt-pb)*v/max), cx=pl+step*i+step/2, y=H-pb-h, r=Math.min(4,h/2);
    var path = h>0 ? 'M'+(cx-bw/2)+','+(H-pb)+' V'+(y+r)+' Q'+(cx-bw/2)+','+y+' '+(cx-bw/2+r)+','+y+' H'+(cx+bw/2-r)+' Q'+(cx+bw/2)+','+y+' '+(cx+bw/2)+','+(y+r)+' V'+(H-pb)+' Z' : '';
    out+='<g class="pn-b" data-tip="'+esc(rotulo(x)+': '+fmtv(v))+'" data-x="'+cx+'" data-y="'+y+'">'+
      '<rect x="'+(cx-step/2)+'" y="'+pt+'" width="'+step+'" height="'+(H-pt-pb)+'" fill="transparent"/>'+
      (path?'<path d="'+path+'" fill="var(--blue)" opacity="'+(i===dest?1:0.55)+'"/>':'<rect x="'+(cx-bw/2)+'" y="'+(H-pb-2)+'" width="'+bw+'" height="2" fill="var(--line)"/>')+
      (i===dest?'<text x="'+cx+'" y="'+(y-7)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)" font-family="var(--f-mono)">'+esc(fmtv(v))+'</text>':'')+
      '<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+esc(rotulo(x))+'</text></g>';
  });
  return out+'</svg>';
}

/* reduz a imagem no browser: no máximo 360 px, para o logótipo ficar leve e sair sempre no PDF */
function lerLogo(ficheiro, fim){
  if(!ficheiro) return fim('Escolha uma imagem.');
  if(!/^image\/(png|jpeg|jpg|webp|gif|svg\+xml)$/i.test(ficheiro.type)) return fim('Use uma imagem PNG, JPG, WEBP ou SVG.');
  if(ficheiro.size > 8*1024*1024) return fim('A imagem tem mais de 8 MB. Escolha uma mais pequena.');
  var fr=new FileReader();
  fr.onerror=function(){ fim('Não foi possível ler a imagem.'); };
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){ fim('Esta imagem não abre. Tente outra.'); };
    img.onload=function(){
      var max=360, w=img.naturalWidth||img.width||max, h=img.naturalHeight||img.height||max, k=Math.min(1, max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
      var g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(img,0,0,c.width,c.height);
      var url=c.toDataURL('image/png');
      if(url.length>280000){ var g2=document.createElement('canvas'); g2.width=c.width; g2.height=c.height; var x=g2.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(c,0,0); url=g2.toDataURL('image/jpeg',0.86); }
      if(url.length>290000) return fim('O logótipo continua grande demais. Use uma imagem mais simples.');
      fim(null,url);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(ficheiro);
}

/* ================= HORÁRIOS ================= */
var DIAS_C=['','Seg','Ter','Qua','Qui','Sex','Sáb'], DIAS_L=['','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function minutos(h){ var p=String(h||'').split(':'); return (+p[0])*60+(+p[1]); }
function hhmm(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function gerarTempos(inicio, n, dur, pausa, recreioDepois, recreio){
  var t=[], m=minutos(inicio);
  for(var k=0;k<n;k++){ t.push({i:hhmm(m), f:hhmm(m+dur)}); m+=dur+(k+1===recreioDepois?recreio:pausa); }
  return t;
}
function grelhaNova(turma){
  var ini = /tarde/i.test(turma.turno||'')?'12:30':/noite|laboral/i.test(turma.turno||'')?'17:30':'07:00';
  return { dias:[1,2,3,4,5], tempos:gerarTempos(ini,6,45,5,3,20), aulas:{} };
}
function pHorarios(){
  aCarregar();
  api('/horarios').then(function(d){
    if(!d.ok){ $('#page').innerHTML=erroCaixa(d.erro); return; }
    S.H={ d:d, turma:(S.H&&S.H.turma)||'', grelha:null, publicado:false, sujo:false };
    if(!d.turmas.length){ $('#page').innerHTML=ph('Escola','Horários','')+vazio('layers','Crie primeiro uma turma','Os horários são feitos por turma. Vá a "Turmas e salas".'); return; }
    if(!d.turmas.some(function(t){ return t.id===S.H.turma; })) S.H.turma=d.turmas[0].id;
    abrirTurmaH();
  });
}
function abrirTurmaH(){
  var H=S.H, t=H.d.turmas.filter(function(x){ return x.id===H.turma; })[0];
  var h=H.d.horarios.filter(function(x){ return x.turma===H.turma; })[0];
  H.grelha = h ? JSON.parse(JSON.stringify(h.grelha)) : grelhaNova(t);
  H.publicado = h ? h.publicado : false; H.existe=!!h; H.sujo=false;
  desenharH();
}
function desenharH(){
  var H=S.H, d=H.d, g=H.grelha, t=d.turmas.filter(function(x){ return x.id===H.turma; })[0];
  var DM={}; d.disciplinas.forEach(function(x){ DM[x.id]=x; }); var PM={}; d.professores.forEach(function(x){ PM[x.id]=x; });
  var conta={}; Object.keys(g.aulas).forEach(function(k){ var a=g.aulas[k]; conta[a.d]=(conta[a.d]||0)+1; });
  var daTurma=(t.disciplinas||[]).filter(function(id){ return DM[id]; });
  var nAulas=Object.keys(g.aulas).length;
  $('#page').innerHTML=ph('Escola','Horários', H.existe ? (H.publicado?'<span class="pill ok">Publicado</span> As famílias já vêem este horário no portal.':'<span class="pill warn">Rascunho</span> Ainda não está visível para as famílias.') : 'Monte o horário da turma: escolha os dias, os tempos, e clique numa célula para marcar a aula.',
      '<select class="sel" id="h-t">'+d.turmas.map(function(x){ return '<option value="'+x.id+'"'+(x.id===H.turma?' selected':'')+'>'+esc(x.nome)+'</option>'; }).join('')+'</select>'+
      '<label class="btn" style="cursor:pointer"><input type="checkbox" id="h-pub"'+(H.publicado?' checked':'')+'> Publicar</label>'+
      '<button class="btn pri" id="h-save">'+ic('save')+'Guardar'+(H.sujo?' *':'')+'</button>')+
    '<div id="h-err"></div>'+
    '<div style="display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start" class="h-lay">'+
      '<section class="card card-b"><div class="hg-wrap"><table class="hg"><thead><tr><th></th>'+g.dias.map(function(dd){ return '<th>'+DIAS_C[dd]+'</th>'; }).join('')+'</tr></thead><tbody>'+
        g.tempos.map(function(tp,ti){ return '<tr><td class="t">'+tp.i+'<br>'+tp.f+'</td>'+g.dias.map(function(dd){ var a=g.aulas[dd+'-'+ti], ds=a&&DM[a.d];
          return ds ? '<td class="c on" data-c="'+dd+'-'+ti+'" style="border-color:'+esc(ds.cor||'#0A64DC')+';background:color-mix(in srgb,'+esc(ds.cor||'#0A64DC')+' 9%,var(--surface))"><b>'+esc(ds.nome)+'</b><small>'+esc(a.p&&PM[a.p]?PM[a.p].nome:'sem professor')+'</small>'+(a.s?'<small>'+esc(a.s)+'</small>':'')+'</td>'
                    : '<td class="c" data-c="'+dd+'-'+ti+'"><span class="mais">+</span></td>'; }).join('')+'</tr>'; }).join('')+
      '</tbody></table></div>'+
      '<div style="margin-top:12px"><div class="small muted" style="margin-bottom:6px;font-weight:600">Aulas por semana · '+nAulas+' marcadas</div><div class="carga">'+

      '</div></div></section>'+
      '<section class="card card-b"><div class="eyebrow" style="margin-bottom:8px">Dias de aulas</div><div class="chips">'+[1,2,3,4,5,6].map(function(dd){ return '<label><input type="checkbox" data-dia="'+dd+'"'+(g.dias.indexOf(dd)>=0?' checked':'')+'>'+DIAS_C[dd]+'</label>'; }).join('')+'</div>'+
        '<div class="eyebrow" style="margin:16px 0 8px">Tempos</div>'+
        g.tempos.map(function(tp,ti){ return '<div class="tempo"><span class="small muted mono">'+(ti+1)+'º</span><input class="inp" type="time" data-ti="'+ti+'" data-k="i" value="'+tp.i+'"><input class="inp" type="time" data-ti="'+ti+'" data-k="f" value="'+tp.f+'"></div>'; }).join('')+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn sm" id="h-mais">'+ic('plus')+'Tempo</button><button class="btn sm" id="h-menos"'+(g.tempos.length>1?'':' disabled')+'>Tirar último</button><button class="btn sm ghost" id="h-gerar">Gerar tempos…</button></div>'+
        '<p class="small muted" style="margin:14px 0 0">O Gescolar avisa se um professor ficar com duas turmas à mesma hora.</p></section>'+
    '</div>';
  if(window.innerWidth<900){ var l=$('.h-lay'); if(l) l.style.gridTemplateColumns='minmax(0,1fr)'; }
  function sujar(){ H.sujo=true; }
  $('#h-t').onchange=function(){ var v=this.value; if(H.sujo && !confirm('Tem alterações por guardar nesta turma. Mudar mesmo assim?')){ this.value=H.turma; return; } H.turma=v; abrirTurmaH(); };
  $('#h-pub').onchange=function(){ H.publicado=this.checked; sujar(); $('#h-save').innerHTML=ic('save')+'Guardar *'; };
  $$('[data-dia]').forEach(function(c){ c.onchange=function(){ var dd=+c.getAttribute('data-dia'); if(c.checked){ g.dias.push(dd); g.dias.sort(); } else { if(g.dias.length===1){ c.checked=true; toast('Tem de haver pelo menos um dia'); return; } g.dias=g.dias.filter(function(x){ return x!==dd; }); Object.keys(g.aulas).forEach(function(k){ if(+k.split('-')[0]===dd) delete g.aulas[k]; }); } sujar(); desenharH(); }; });
  $$('[data-ti]').forEach(function(inp){ inp.onchange=function(){ var ti=+inp.getAttribute('data-ti'); if(!/^\d\d:\d\d$/.test(inp.value)) return; g.tempos[ti][inp.getAttribute('data-k')]=inp.value; sujar(); desenharH(); }; });
  $('#h-mais').onclick=function(){ if(g.tempos.length>=14){ toast('No máximo 14 tempos'); return; } var u=g.tempos[g.tempos.length-1], m=minutos(u.f)+5, dur=minutos(u.f)-minutos(u.i)||45; g.tempos.push({i:hhmm(m),f:hhmm(Math.min(m+dur,23*60+59))}); sujar(); desenharH(); };
  $('#h-menos').onclick=function(){ var n=g.tempos.length-1; g.tempos.pop(); Object.keys(g.aulas).forEach(function(k){ if(+k.split('-')[1]===n) delete g.aulas[k]; }); sujar(); desenharH(); };
  $('#h-gerar').onclick=function(){
    modal('<div class="modal-h"><h3>Gerar tempos</h3><button class="icon-btn" data-fechar>'+ic('x')+'</button></div><div class="modal-b">'+
      '<div class="frow"><label class="field">Primeiro tempo começa<input class="inp" type="time" id="g-i" value="'+g.tempos[0].i+'"></label><label class="field">Número de tempos<input class="inp" type="number" min="1" max="14" id="g-n" value="'+g.tempos.length+'"></label></div>'+
      '<div class="frow"><label class="field">Duração (min)<input class="inp" type="number" min="20" max="120" id="g-d" value="45"></label><label class="field">Intervalo entre tempos (min)<input class="inp" type="number" min="0" max="30" id="g-p" value="5"></label></div>'+
      '<div class="frow"><label class="field">Recreio depois do tempo nº<input class="inp" type="number" min="0" max="13" id="g-r" value="3"></label><label class="field">Duração do recreio (min)<input class="inp" type="number" min="0" max="60" id="g-rd" value="20"></label></div>'+
      '<p class="small muted" style="margin:0">As aulas já marcadas ficam nos mesmos tempos.</p></div><div class="modal-f"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="g-ok">Gerar</button></div>');
    $('#g-ok').onclick=function(){
      var n=Math.max(1,Math.min(14,+$('#g-n').value||6)), dur=Math.max(20,Math.min(120,+$('#g-d').value||45));

      g.tempos=gerarTempos(ini,n,dur,Math.max(0,+$('#g-p').value||0),+$('#g-r').value||0,Math.max(0,+$('#g-rd').value||0));

  };
  $$('[data-c]').forEach(function(td){ td.onclick=function(){ celulaH(td.getAttribute('data-c'), daTurma, DM); }; });
  $('#h-save').onclick=function(){
    var btn=this; aGravar(btn,true); $('#h-err').innerHTML='';

      var h=H.d.horarios.filter(function(x){ return x.turma===H.turma; })[0];
      if(h){ h.grelha=r.grelha; h.publicado=r.publicado; } else H.d.horarios.push({id:r.id, turma:H.turma, grelha:r.grelha, publicado:r.publicado});
      H.grelha=JSON.parse(JSON.stringify(r.grelha)); H.existe=true; H.sujo=false;
      toast(r.publicado?'Horário guardado e publicado':'Horário guardado como rascunho'); desenharH();
    });
  };
}
function celulaH(chave, daTurma, DM){
  var H=S.H, g=H.grelha, a=g.aulas[chave]||{}, dd=+chave.split('-')[0], ti=+chave.split('-')[1], tp=g.tempos[ti];
  var outras=H.d.disciplinas.filter(function(x){ return daTurma.indexOf(x.id)<0; });
  function opDisc(){ return '<option value="">— Sem aula —</option>'+(daTurma.length?'<optgroup label="Desta turma">'+daTurma.map(function(id){ return '<option value="'+id+'"'+(a.d===id?' selected':'')+'>'+esc(DM[id].nome)+'</option>'; }).join('')+'</optgroup>':'')+(outras.length?'<optgroup label="Outras">'+outras.map(function(x){ return '<option value="'+x.id+'"'+(a.d===x.id?' selected':'')+'>'+esc(x.nome)+'</option>'; }).join('')+'</optgroup>':''); }
  function opProf(did){ var dl=H.d.professores.filter(function(p){ return did && (p.disciplinas||[]).indexOf(did)>=0; }), resto=H.d.professores.filter(function(p){ return dl.indexOf(p)<0; });
    return '<option value="">— Sem professor —</option>'+(dl.length?'<optgroup label="Dão esta disciplina">'+dl.map(function(p){ return '<option value="'+p.id+'"'+(a.p===p.id?' selected':'')+'>'+esc(p.nome)+'</option>'; }).join('')+'</optgroup>':'')+(resto.length?'<optgroup label="Outros">'+resto.map(function(p){ return '<option value="'+p.id+'"'+(a.p===p.id?' selected':'')+'>'+esc(p.nome)+'</option>'; }).join('')+'</optgroup>':''); }
  modal('<div class="modal-h"><h3>'+DIAS_L[dd]+' · '+tp.i+'–'+tp.f+'</h3><button class="icon-btn" data-fechar>'+ic('x')+'</button></div><div class="modal-b">'+
    '<label class="field">Disciplina<select class="sel" id="c-d">'+opDisc()+'</select></label>'+
    '<label class="field">Professor<select class="sel" id="c-p">'+opProf(a.d)+'</select></label>'+
    '<label class="field">Sala (opcional)<input class="inp" id="c-s" maxlength="30" value="'+esc(a.s||'')+'" placeholder="Ex.: Laboratório"></label>'+
    '<label class="small" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="c-all"> Repetir em todos os dias neste tempo</label></div>'+
    '<div class="modal-f">'+(a.d?'<button class="btn danger" id="c-x">'+ic('trash')+'Limpar</button>':'')+'<button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="c-ok">Aplicar</button></div>');
  $('#c-d').onchange=function(){ a.d=this.value; var pv=$('#c-p').value; $('#c-p').innerHTML=opProf(this.value); $('#c-p').value=pv; if($('#c-p').value!==pv) $('#c-p').value=''; };
  var x=$('#c-x'); if(x) x.onclick=function(){ delete g.aulas[chave]; H.sujo=true; fechar(); desenharH(); };
  $('#c-ok').onclick=function(){
    var d=$('#c-d').value, p=$('#c-p').value, s=$('#c-s').value.trim(), alvo=$('#c-all').checked?g.dias.map(function(z){ return z+'-'+ti; }):[chave];
    alvo.forEach(function(k){ if(d) g.aulas[k]={d:d,p:p,s:s}; else delete g.aulas[k]; });
    H.sujo=true; fechar(); desenharH();
  };
}

function hojeLocal(){ var d=new Date(Date.now()+2*3600e3); return d.toISOString().slice(0,10); }

function pPresencas(){

function abrirChamadaDir(turma, data, tempo, depois){
  var ch=null;
  modal('<div class="modal-h"><h3>Chamada</h3><button class="icon-btn" id="cq-x">'+ic('x')+'</button></div><div class="modal-b" id="cq"><div class="carregar"><div class="spinner"></div>A abrir…</div></div>');
  var m=$('#ov .modal'); if(m) m.style.maxWidth='640px';
  window.__gsSujo=function(){ return ch && ch.sujo(); };
  var fecharC=function(){ if(ch && ch.sujo() && !confirm('Tem alterações por guardar. Fechar mesmo assim?')) return; fechar(); if(depois) depois(); };
  var ov=$('#ov'); if(ov){ var nov=ov.cloneNode(true); ov.parentNode.replaceChild(nov,ov); nov.addEventListener('mousedown',function(e){ if(e.target===nov) fecharC(); }); }

  });

function presencasTurma(){

    S.P=S.P||{ turma:S.turmas[0].id, tri:triActual() };

function esperarAssinatura(r){
  var fim=Date.now()+4*60e3, parado=false;
  modal('<div class="modal-b" style="text-align:center;padding:26px 20px"><div class="spinner"></div><h3 style="margin-top:10px">'+(r.link?'À espera do pagamento com cartão':'Confirme no telemóvel')+'</h3><p class="muted">'+(r.link?'Pague na página segura da MozPayment. Esta janela actualiza sozinha.':esc(r.mensagem||''))+'</p>'+
    (r.link?'<a class="btn pri" href="'+esc(r.link)+'" target="_blank" rel="noopener" style="text-decoration:none;justify-content:center;margin-bottom:10px">Abrir a página de pagamento</a>':'')+
    '<p class="small muted" id="w-st">A aguardar confirmação · '+mt(r.total)+'</p></div><div class="modal-f"><button class="btn" id="w-x">Fechar e ver depois</button></div>');
  $('#w-x').onclick=function(){ parado=true; fechar(); pAssinatura(); };
  (function verificar(){
    if(parado) return;
    if(Date.now()>fim){ var s=$('#w-st'); if(s) s.textContent='Ainda sem confirmação. Quando o pagamento for confirmado, a assinatura é renovada sozinha.'; return; }
    api('/assinatura-estado',{id:r.id}).then(function(x){
      if(parado) return;
      if(x.ok && x.estado==='pago'){ parado=true;
        modal('<div class="modal-b" style="text-align:center;padding:26px 20px"><div style="width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto;color:#fff">'+ic('check','width="30" height="30"')+'</div><h3 style="margin-top:14px">Assinatura renovada</h3><p class="muted">Válida até <b style="color:var(--ink)">'+data(x.valida_ate)+'</b>. Obrigado!</p></div><div class="modal-f"><button class="btn pri" id="w-ok">Concluir</button></div>');
        $('#w-ok').onclick=function(){ fechar(); fetch(PROXY+'/sessao',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SES.token}}).then(function(r){ return r.json(); }).then(function(d){ if(d.ok){ S.escola=d.escola; } casca(); }); }; return; }
      if(x.ok && (x.estado==='falhado'||x.estado==='expirado')){ var s=$('#w-st'); if(s) s.innerHTML='<b style="color:var(--bad)">O pagamento '+(x.estado==='falhado'?'falhou ou foi cancelado':'expirou')+'.</b> Pode tentar outra vez.'; return; }
      setTimeout(verificar,4000);
    });
  })();
}

  .then(function(x){
    var d=x.d;
    if(x.st===401 || !d.ok){ if(x.st===401) return sair(); $('#root').innerHTML='<div class="carregar">'+esc(d.erro||'Não foi possível abrir o painel.')+' <a class="link" href="entrar.html">Voltar a entrar</a></div>'; return; }
    if(d.pagina!=='direccao'){ location.replace((d.pagina||'entrar')+'.html'); return; }
    S.escola=d.escola; S.nome=d.nome; S.plataforma=!!d.plataforma; S.papel=d.papel;
    SES.token=d.token; try{ localStorage.setItem('gs_sessao', JSON.stringify({token:d.token,nome:d.nome,papel:d.papel,pagina:d.pagina,escola:d.escola,criada:Date.now()})); }catch(e){}
    casca();
  })
  .catch(function(){ $('#root').innerHTML='<div class="carregar">Sem ligação ao servidor do Gescolar. Na primeira vez do dia pode demorar alguns segundos. <a class="link" href="">Tentar de novo</a></div>'; });
document.addEventListener('click',function(e){ var sd=$('#side'); if(sd && !e.target.closest('#side') && !e.target.closest('#menu')) sd.classList.remove('open'); });
})();
